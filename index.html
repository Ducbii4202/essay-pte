<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PTE Trainer – Essay · Repeat Sentence · Dictation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F7F8FA; --card:#FFFFFF; --ink:#1F2430; --muted:#667085; --line:#E3E6EC;
  --fixed-bg:#FFE58A; --fixed-ink:#3D2E00;
  --x:#1D5FD1; --l:#1E8A3C; --h:#C9302C;
  --accent:#1D5FD1; --ok:#1E8A3C; --warn:#C77700; --bad:#C9302C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171D; --card:#1F242D; --ink:#EEF1F6; --muted:#9AA4B5; --line:#323A47;
    --fixed-bg:#5C4B10; --fixed-ink:#FFE9A0; --x:#7DB0FF; --l:#6FD08A; --h:#FF8A84; --accent:#7DB0FF;
    --ok:#6FD08A; --warn:#F2B04C; --bad:#FF8A84;
  }
}
:root[data-theme="dark"]{
  --bg:#14171D; --card:#1F242D; --ink:#EEF1F6; --muted:#9AA4B5; --line:#323A47;
  --fixed-bg:#5C4B10; --fixed-ink:#FFE9A0; --x:#7DB0FF; --l:#6FD08A; --h:#FF8A84; --accent:#7DB0FF;
  --ok:#6FD08A; --warn:#F2B04C; --bad:#FF8A84;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 "Be Vietnam Pro",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg)}
h1{font:800 28px/1.2 "Baloo 2",sans-serif;margin:8px 0 12px}
h2{font:800 20px/1.25 "Baloo 2",sans-serif;margin:18px 0 6px}
p{margin:8px 0}
.vi{color:var(--muted);font-size:15px}
button{font-family:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--fixed-bg);outline-offset:2px}

/* top tabs */
#top{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
#top button{flex:1;min-height:54px;border:0;background:none;color:var(--muted);font:600 13px "Be Vietnam Pro",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;line-height:1.2}
#top button b{font-size:20px;font-weight:400}
#top button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column}
.panel[hidden]{display:none}
.scroll{flex:1;overflow-y:auto;padding:8px 16px 28px}

/* lesson chrome */
.lhead{padding:10px 16px 4px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.step{font-size:13px;color:var(--muted);margin-top:6px}
.lfoot{display:flex;gap:10px;padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--card)}
.lfoot button{flex:1;min-height:52px;border-radius:14px;font:600 17px "Be Vietnam Pro",sans-serif;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.lfoot button.next{background:var(--accent);border-color:var(--accent);color:#fff}
.lfoot button:disabled{opacity:.35;cursor:default}

/* lesson content */
.f{background:var(--fixed-bg);color:var(--fixed-ink);padding:1px 5px;border-radius:5px;font-weight:600}
.x{color:var(--x);font-weight:600;border-bottom:2px solid var(--x)}
.l{color:var(--l);font-weight:600;border-bottom:2px solid var(--l)}
.h{color:var(--h);font-weight:600;border-bottom:2px solid var(--h)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.box.legend div{display:flex;align-items:center;gap:10px;margin:8px 0}
.sent{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px;margin:12px 0}
.sent .lab{font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.sent .en{font-size:18px;line-height:1.7}
.sent .vi{margin-top:6px}
.arrow{text-align:center;font-size:22px;color:var(--muted);margin:2px 0}
.tip{background:color-mix(in srgb,var(--fixed-bg) 45%,var(--card));border-radius:12px;padding:12px 14px;margin:14px 0;font-size:16px}
.stack div{border-radius:12px;padding:14px;margin:8px 0;font-weight:600;color:#fff}
.stack .a{background:#C98A1B}.stack .b{background:#2F8F45}.stack .c{background:#B5473A}.stack .d{background:#C98A1B}
.stack small{display:block;font-weight:400;opacity:.95}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-size:13px}
.k{display:inline-block;min-width:44px;text-align:center;font-weight:700;border-radius:8px;padding:1px 8px;color:#fff;background:var(--accent)}
.ex{background:var(--card);border:2px dashed var(--accent);border-radius:14px;padding:14px;margin:14px 0}
.ex .t{font-weight:700;color:var(--accent)}
.rv{margin-top:8px;min-height:46px;width:100%;border-radius:12px;border:0;background:var(--accent);color:#fff;font:600 16px "Be Vietnam Pro",sans-serif;cursor:pointer}
.ans{margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--l) 14%,var(--card))}
.ans[hidden]{display:none}
.essay p{margin:12px 0}
.tag{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.tag.y{background:#C9302C}.tag.v{background:#7A4A1F}.tag.vi{background:#5B5BD6}.tag.vay{background:#1D8A8A}

/* sub tabs */
.seg{display:flex;gap:6px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.seg button{flex:1;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 13px/1.2 "Be Vietnam Pro",sans-serif;cursor:pointer;padding:4px}
.seg button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* practice */
.ttsbar{display:flex;gap:8px;margin:6px 0 10px}
.ttsbar select{flex:1;min-width:0;min-height:42px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 14px "Be Vietnam Pro",sans-serif;padding:0 8px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0}
.meta{font-size:13px;color:var(--muted);font-weight:600}
.sentence{font:600 22px/1.45 "Baloo 2","Be Vietnam Pro",sans-serif;margin:8px 0}
.blur{filter:blur(9px);user-select:none;cursor:pointer}
.hide{visibility:hidden}
.btns{display:flex;gap:8px;margin:10px 0}
.btns>*{flex:1}
.btn{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px "Be Vietnam Pro",sans-serif;cursor:pointer;padding:6px 10px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:44px;font-size:14px}
.btn:disabled{opacity:.4}
.status{text-align:center;font-weight:600;padding:10px;border-radius:12px;background:color-mix(in srgb,var(--accent) 12%,var(--card));margin:10px 0}
.status.rec{background:color-mix(in srgb,var(--bad) 16%,var(--card));color:var(--bad)}
.live{min-height:26px;color:var(--muted);font-style:italic;text-align:center;margin:4px 0}
audio{width:100%;margin-top:6px}
.note{font-size:13px;color:var(--muted);margin:8px 0}
.warnbox{background:color-mix(in srgb,var(--warn) 18%,var(--card));border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.sc small{display:block;color:var(--muted);font-size:12px}
.sc b{font:800 22px "Baloo 2",sans-serif}
.total{text-align:center;font:800 40px/1.1 "Baloo 2",sans-serif;margin:6px 0}
.w-ok{color:var(--ok);font-weight:600}
.w-miss{color:var(--bad);font-weight:600;text-decoration:underline wavy}
.w-sp{color:var(--warn);font-weight:600}
.w-ex{color:var(--muted);text-decoration:line-through}
.words{font-size:18px;line-height:1.9}
textarea.type{width:100%;min-height:96px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:18px/1.5 "Be Vietnam Pro",sans-serif;padding:10px;resize:vertical}

/* list */
.search{width:100%;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:16px "Be Vietnam Pro",sans-serif;padding:0 12px;margin:8px 0}
.count{font-size:13px;color:var(--muted);margin-bottom:6px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.item .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.item .num{font-size:12px;font-weight:700;color:var(--muted)}
.item .en{font-weight:600;margin:4px 0}
.item .acts{display:flex;gap:8px;margin-top:8px}
.item .acts button{min-height:42px;flex:1;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px "Be Vietnam Pro",sans-serif;cursor:pointer}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;background:color-mix(in srgb,var(--ok) 20%,var(--card));color:var(--ok)}
/* ===== v2: stage / practice ===== */
.stage{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.modes{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.modes button{flex:1;min-height:42px;border:0;border-radius:11px;background:none;color:var(--muted);font:600 14px "Be Vietnam Pro",sans-serif;cursor:pointer}
.modes button.on{background:var(--accent);color:#fff}
.sent-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.sent-card .sentence{font:600 24px/1.4 "Baloo 2","Be Vietnam Pro",sans-serif;text-align:center;margin:4px 0}
.sent-card .vi{text-align:center;margin-top:6px}
.links{display:flex;gap:6px;justify-content:center;margin-top:8px}
.link{border:0;background:none;color:var(--accent);font:600 14px "Be Vietnam Pro",sans-serif;min-height:40px;padding:0 10px;cursor:pointer}
.controls{display:flex;justify-content:center;gap:40px;padding:8px 0 2px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.round{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .1s}
.round:active{transform:scale(.95)}
.round svg{width:36px;height:36px}
.round.mic{background:var(--bad);box-shadow:0 6px 16px color-mix(in srgb,var(--bad) 35%,transparent)}
.round.mic.on{box-shadow:0 0 0 calc(6px + var(--lvl,0)*26px) color-mix(in srgb,var(--bad) 28%,transparent);transition:box-shadow .08s}
.stage.speaking .round.play{animation:beat 1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.stage.speaking .round.play{animation:none}}
.keep{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);justify-content:center}
.keep input{margin-top:3px}
.voice-note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}
.navrow{display:flex;gap:8px}
.navrow button{flex:1;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 14px "Be Vietnam Pro",sans-serif;cursor:pointer}

/* result */
.res{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ring{position:relative;width:132px;height:132px;margin:2px auto 8px}
.ring svg{transform:rotate(-90deg);display:block}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;font:800 40px/1 "Baloo 2",sans-serif}
.ring .num small{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.verdict{text-align:center;font-weight:600;margin-bottom:10px}
.metric{margin:10px 0}
.mrow{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px}
.mbar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:9px}
.sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.advice{background:color-mix(in srgb,var(--accent) 10%,var(--card));border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.res .btns{margin-bottom:0}

/* list v2 */
.list-head{position:sticky;top:-8px;z-index:2;background:var(--bg);padding:4px 0 2px}
.searchbox{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:0 12px;min-height:48px;color:var(--muted)}
.searchbox input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:16px "Be Vietnam Pro",sans-serif;min-height:44px;outline:none}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px}
.fc{flex:none;min-height:38px;padding:0 12px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 13px "Be Vietnam Pro",sans-serif;cursor:pointer}
.fc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;min-height:34px}
.li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.li-num{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--bg);color:var(--muted)}
.li-num.review{background:color-mix(in srgb,var(--warn) 20%,var(--card));color:var(--warn)}
.li-num.good{background:color-mix(in srgb,var(--ok) 20%,var(--card));color:var(--ok)}
.li-main{flex:1;min-width:0}
.li-en{font-weight:600;line-height:1.45}
.li-vi{color:var(--muted);font-size:14px;margin-top:3px}
.li-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.li-acts{display:flex;flex-direction:column;gap:6px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.more{width:100%;margin:6px 0}

/* history */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:800 26px/1.2 "Baloo 2",sans-serif}
.stat small{color:var(--muted);font-size:12px}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.chartbox svg{width:100%;height:auto;display:block}
details.h{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0}
details.h summary{display:flex;gap:12px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
details.h summary::-webkit-details-marker{display:none}
.sc-chip{flex:none;min-width:52px;text-align:center;border-radius:12px;padding:6px 4px;font:800 20px/1 "Baloo 2",sans-serif}
.sc-chip small{font-size:11px;font-weight:600;opacity:.8}
.sc-chip.ok{background:color-mix(in srgb,var(--ok) 20%,var(--card));color:var(--ok)}
.sc-chip.warn{background:color-mix(in srgb,var(--warn) 20%,var(--card));color:var(--warn)}
.sc-chip.bad{background:color-mix(in srgb,var(--bad) 20%,var(--card));color:var(--bad)}
.h-main{flex:1;min-width:0}
.h-sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.chev{color:var(--muted);transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.h-body{padding:0 12px 12px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty b{display:block;font:800 22px "Baloo 2",sans-serif;color:var(--ink);margin-bottom:6px}
.danger{margin-top:14px;width:100%;min-height:46px;border-radius:12px;border:2px solid color-mix(in srgb,var(--bad) 50%,var(--line));background:none;color:var(--bad);font:600 14px "Be Vietnam Pro",sans-serif;cursor:pointer}
/* ===== v3: bộ đề (sets) ===== */
.setbar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.setbar .si{font-size:20px}
.setbar select{flex:1;min-width:0;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px "Be Vietnam Pro",sans-serif;padding:0 10px}
.setbar .btn{flex:none;min-height:44px;padding:0 12px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font:800 20px "Baloo 2",sans-serif}
.sheet-h .x{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.sheet-b{overflow-y:auto;padding:0 16px 24px}
.fl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:8px 0}
.txt{display:block;width:100%;margin-top:4px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:16px "Be Vietnam Pro",sans-serif;padding:0 12px}
.filebtn{display:flex;align-items:center;justify-content:center;width:100%;text-align:center;cursor:pointer;margin:8px 0}
.pf{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.pf-n{font-weight:600;word-break:break-all}
.pf-s{font-size:13px;color:var(--muted);margin:2px 0 6px}
.pf-s.ok{color:var(--ok)}.pf-s.err{color:var(--bad)}.pf-s.warn{color:var(--warn)}
.pf select{width:100%;min-height:42px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:500 14px "Be Vietnam Pro",sans-serif;padding:0 8px}
.srow{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:6px 0}
.srow.cur{border-color:var(--accent)}
.s-main{flex:1;min-width:0}
.s-main b{display:block;overflow-wrap:anywhere}
.s-main span{font-size:12px;color:var(--muted)}
.srow button{min-height:40px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px "Be Vietnam Pro",sans-serif;cursor:pointer;flex:none}
.srow button.del{color:var(--bad)}
.gh{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 2px}
.okmsg{background:color-mix(in srgb,var(--ok) 16%,var(--card));border:1px solid var(--ok);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
/* ===== v4: AI ===== */
#top #ai-btn{flex:none;width:58px;position:relative}
#top #ai-btn.on::after{content:"";position:absolute;top:10px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.aicard{background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.ai-h{font:800 18px "Baloo 2",sans-serif;margin-bottom:6px}
.ai-load{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;padding:6px 0}
.ai-load i{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ai-load i{animation:none}}
.ai-scores{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.ai-total{font:800 26px "Baloo 2",sans-serif;margin-right:6px}
.ai-sum{margin:6px 0 10px}
.ai-note{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.ai-note b{display:block;margin-bottom:2px}
.wf{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;background:var(--bg)}
.wf .w{font:800 18px "Baloo 2",sans-serif}
.wf small{color:var(--muted)}
.wf .how{margin-top:4px}
.wf .dr{margin-top:4px;color:var(--accent);font-weight:600}
.aicard ol{margin:4px 0 8px;padding-left:20px;font-size:14px}
.aicard ol li{margin:3px 0}
.aigoal{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}

/* essay chat */
.chat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:22px 0 8px}
.chat-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font:800 17px "Baloo 2",sans-serif;margin-bottom:6px}
.chat-msgs{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;padding:2px}
.msg{max-width:92%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a p{margin:4px 0}.msg.a h4{margin:10px 0 4px;font:800 15px "Baloo 2",sans-serif}
.msg.a ul{margin:4px 0;padding-left:20px}.msg.a code{background:var(--line);border-radius:4px;padding:0 4px}
.msg.err{border-color:var(--bad);color:var(--bad)}
.typing{color:var(--muted);font-style:italic}
.chat-modes{display:flex;gap:6px;margin:10px 0 6px}
.chat-modes button{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 12.5px/1.2 "Be Vietnam Pro",sans-serif;cursor:pointer;padding:4px}
.chat-modes button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chat-quick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.chat-quick button{flex:none;min-height:36px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 13px "Be Vietnam Pro",sans-serif;padding:0 12px;cursor:pointer}
.chat-in{width:100%;min-height:84px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:16px/1.45 "Be Vietnam Pro",sans-serif;padding:10px;resize:vertical}
.chat-row{display:flex;gap:8px;margin-top:8px}
.chat-row .btn{flex:1;min-height:48px}
.chat .hintline{font-size:12px;color:var(--muted);margin-top:6px}
/* ===== v5: essay practice, files, notebook ===== */
[hidden]{display:none!important}
.subpanel{flex:1;min-height:0;display:flex;flex-direction:column}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.seg button{min-height:42px}
.prompt{font:600 20px/1.45 "Baloo 2","Be Vietnam Pro",sans-serif}
.timerbar{display:flex;align-items:center;gap:10px}
.timerbar .btn{flex:none}
.timev{font:800 22px "Baloo 2",sans-serif;font-variant-numeric:tabular-nums}
.timev.late{color:var(--bad)}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.pbox-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
.pwc{font-size:12px;color:var(--muted);font-weight:600}
.pbox textarea{width:100%;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",sans-serif;padding:10px;resize:vertical}
.pbox .btn{width:100%;margin-top:8px}
.wcbar{text-align:center;font-weight:600;font-size:14px;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.wcbar.ok{color:var(--ok);border-color:var(--ok)}.wcbar.warn{color:var(--warn);border-color:var(--warn)}.wcbar.bad{color:var(--bad);border-color:var(--bad)}
.pp{margin:12px 0}
.pp-h{font:800 16px "Baloo 2",sans-serif;color:var(--accent)}
details.sn{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;margin:6px 0;background:var(--bg)}
details.sn.fix{border-left-color:var(--warn)}details.sn.weak{border-left-color:var(--bad)}
details.sn summary{display:flex;gap:8px;padding:9px 10px;cursor:pointer;list-style:none;font-size:14px}
details.sn summary::-webkit-details-marker{display:none}
.sn-t{flex:1;min-width:0;overflow-wrap:anywhere}
.sn-b{padding:0 10px 10px;font-size:14px}
.sn-is{margin:2px 0 6px;padding-left:18px;color:var(--bad)}
.sn-row{margin:6px 0}
.sn-tip{margin-top:6px;background:color-mix(in srgb,var(--fixed-bg) 40%,var(--card));border-radius:10px;padding:7px 10px}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.vchip{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:99px;padding:3px 10px;font-size:13px}
.vgrid{display:grid;grid-template-columns:1fr;gap:6px}
.vcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px;margin:4px 0}
.vcard b{font:800 17px "Baloo 2",sans-serif}
.vcard small{color:var(--muted)}.vcard small.muted{font-size:12px}
.vtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.x2{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.files-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:4px 0 6px}
.files-head .btn{flex:none}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.fcard.dis{opacity:.78;background:color-mix(in srgb,var(--line) 35%,var(--card))}
.fc-top{display:flex;gap:10px;align-items:flex-start}
.fc-ic{font-size:24px}
.fc-main{flex:1;min-width:0}
.fc-main b{display:block;overflow-wrap:anywhere}
.fc-sub{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.st{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.st.on{color:var(--ok);border-color:var(--ok)}.st.off{color:var(--muted)}
.fc-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.fc-acts button{flex:1 1 70px;min-height:42px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px "Be Vietnam Pro",sans-serif;cursor:pointer}
.fc-acts button.del{color:var(--bad)}
/* ===== v6: AI providers ===== */
.steps{margin:4px 0 8px;padding-left:20px;font-size:14px}
.steps li{margin:3px 0}
.steps a{color:var(--accent);font-weight:600}
.keyrow{display:flex;gap:6px;align-items:center}
.keyrow .txt{flex:1;margin-top:0}
.keyrow .x2{flex:none;width:48px;height:48px}
select.txt{appearance:auto}
.rules{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:12px 0;font-size:14px}
.rules summary{cursor:pointer;font-weight:600}
.rules ul{margin:8px 0 0;padding-left:18px}.rules li{margin:5px 0}
.chk{border-radius:14px;padding:12px;margin:10px 0;border:1px solid var(--line);background:var(--card);font-size:14px}
.chk.ok{border-color:var(--ok)}.chk.warn{border-color:var(--warn)}.chk.bad{border-color:var(--bad)}
.chklist{list-style:none;margin:6px 0;padding:0;font-size:14px}
.chklist li{padding:4px 0;border-bottom:1px solid var(--line)}
.chklist li.ok{color:var(--ok)}.chklist li.bad{color:var(--bad)}
.chklist small{color:var(--muted)}
/* ===== v7: PTE-style status + seconds counter ===== */
.pte-st{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.pte-st.play{border-color:var(--accent)}.pte-st.rec{border-color:var(--bad)}.pte-st.done{border-color:var(--ok)}
.pte-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:15px}
.pte-sec{font:800 34px/1 "Baloo 2",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.pte-sec small{font:600 13px "Be Vietnam Pro",sans-serif;color:var(--muted)}
.pte-bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.pte-bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .1s linear}
.pte-st.rec .pte-bar i{background:var(--bad)}.pte-st.rec.low .pte-bar i{background:var(--warn)}.pte-st.done .pte-bar i{background:var(--ok)}
.pte-hint{font-size:12px;color:var(--muted);min-height:16px}
@media (prefers-reduced-motion:reduce){.pte-bar i{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top" role="tablist" aria-label="Chọn phần học">
    <button role="tab" data-tab="essay" aria-selected="true"><b>📝</b>Essay</button>
    <button role="tab" data-tab="rs" aria-selected="false"><b>🎤</b>Repeat Sentence</button>
    <button role="tab" data-tab="wfd" aria-selected="false"><b>⌨️</b>Write from Dictation</button>
    <button id="ai-btn" aria-label="Cài đặt AI chấm bài" title="Cài đặt AI"><b>🤖</b>AI</button>
  </div>

  <section class="panel" id="p-essay">
    <div class="seg" id="es-seg"></div>
    <div class="setbar" id="essay-setbar" hidden></div>
    <div class="subpanel" id="es-lesson">
      <div class="lhead"><div class="bar"><i id="bar"></i></div><div class="step" id="step"></div></div>
      <div id="main" class="scroll"></div>
      <div class="lfoot"><button id="prev">← Trước</button><button id="next" class="next">Tiếp →</button></div>
    </div>
    <div class="scroll" id="es-body" hidden></div>
  </section>

  <section class="panel" id="p-rs" hidden>
    <div class="setbar" id="rs-setbar"></div>
    <div class="seg" id="rs-seg"></div>
    <div class="scroll" id="rs-body"></div>
  </section>

  <section class="panel" id="p-wfd" hidden>
    <div class="setbar" id="wfd-setbar"></div>
    <div class="seg" id="wfd-seg"></div>
    <div class="scroll" id="wfd-body"></div>
  </section>
</div>
<div id="modal-root"></div>

<script>
/* helpers */
const F=t=>`<span class="f">${t}</span>`;
const X=t=>`<span class="x">${t}</span>`;
const L=t=>`<span class="l">${t}</span>`;
const H=t=>`<span class="h">${t}</span>`;
const sent=(lab,en,vi)=>`<div class="sent"><div class="lab">${lab}</div><div class="en">${en}</div>${vi?`<div class="vi">${vi}</div>`:''}</div>`;
const arrow='<div class="arrow">⬇</div>';
const ex=(q,a)=>`<div class="ex"><div class="t">✏️ Tự làm</div>${q}<button class="rv">Xem đáp án</button><div class="ans" hidden>${a}</div></div>`;

const S=[];

/* 0 */
S.push(`<h1>Viết essay PTE<br>dễ như điền chỗ trống</h1>
<p>Đề thi: <b>1 câu hỏi</b>, viết <b>200–300 từ</b>, trong <b>20 phút</b>.</p>
<p>Điểm hay: <b>không cần sáng tạo</b>. Template là cái khung có sẵn chữ. Bạn chỉ học thuộc khung rồi <b>điền ý của mình</b> vào chỗ trống.</p>
<div class="tip">📌 <b>Cách học:</b> mỗi màn hình chỉ có 1 ý. Đọc chậm, làm bài tập nhỏ, rồi bấm “Tiếp”. Đừng vội, học xong khoảng 20 phút.</div>
<p class="vi">Bài này dùng chủ đề <b>smartphones</b> (điện thoại thông minh) làm ví dụ xuyên suốt.</p>`);

/* 1 */
S.push(`<h1>Bài essay có 4 phần</h1>
<p>Hãy nghĩ essay như cái bánh burger:</p>
<div class="stack">
 <div class="a">🍞 Mở bài<small>Giới thiệu chủ đề + nói phe của bạn (2 câu)</small></div>
 <div class="b">🥬 Thân bài 1: LỢI<small>Nói 1 điều lợi (4 câu)</small></div>
 <div class="c">🥩 Thân bài 2: HẠI<small>Nói 1 điều hại (4 câu)</small></div>
 <div class="d">🍞 Kết bài<small>Chốt lại (1 câu)</small></div>
</div>
<p class="vi">Đề thi 95% là dạng “lợi và hại”, nên khung này dùng được hầu hết các đề.</p>`);

/* 2 */
S.push(`<h1>Cách đọc màu trong bài</h1>
<p>Để khỏi rối, mình dùng 4 màu. Nhìn màu là biết phải làm gì:</p>
<div class="box legend">
 <div>${F('chữ vàng')} <span>= <b>học thuộc</b>, luôn giữ nguyên</span></div>
 <div>${X('chữ xanh dương')} <span>= <b>chủ đề</b> (đề thi cho)</span></div>
 <div>${L('chữ xanh lá')} <span>= <b>ý LỢI</b> của bạn</span></div>
 <div>${H('chữ đỏ')} <span>= <b>ý HẠI</b> của bạn</span></div>
</div>
<p>Ví dụ:</p>
${sent('Khung', `${F('These days,')} ${X('X')} ${F('can be controversial.')}`, 'Chỉ cần thay X.')}
${arrow}
${sent('Sau khi điền', `${F('These days,')} ${X('smartphones')} ${F('can be controversial.')}`, 'Dạo này, điện thoại thông minh gây nhiều tranh cãi.')}
<div class="tip">👉 <b>Chữ vàng không đổi. Chỉ đổi chữ có màu.</b></div>`);

/* 3 */
S.push(`<h1>Mấy ký hiệu lạ trong template</h1>
<p>Template gốc có chữ viết tắt. Đây là nghĩa của chúng:</p>
<div class="box"><table>
<tr><th>Ký hiệu</th><th>Nghĩa</th><th>Ví dụ</th></tr>
<tr><td><span class="k">X</span></td><td>chủ đề của đề bài</td><td>smartphones</td></tr>
<tr><td><span class="k">S</span></td><td>chủ ngữ (ai/cái gì làm)</td><td>Smartphones</td></tr>
<tr><td><span class="k">V</span></td><td>động từ (hành động)</td><td>use, play, reduce</td></tr>
<tr><td><span class="k">O</span></td><td>thứ đứng sau động từ</td><td>games, stress</td></tr>
<tr><td><span class="k">N</span></td><td>danh từ (tên sự vật)</td><td>entertainment</td></tr>
<tr><td><span class="k">V-ing</span></td><td>động từ thêm -ing</td><td>relaxing</td></tr>
</table></div>
<p class="vi">Không cần nhớ hết ngay. Mỗi lần gặp mình sẽ nhắc lại.</p>`);

/* 4 */
S.push(`<h1>Trước khi viết: chọn 2 ý</h1>
<p>Bước <b>quan trọng nhất</b>: chọn trước <b>1 điều lợi</b> và <b>1 điều hại</b>. Chọn đơn giản thôi.</p>
<div class="box">
 <p><b>Chủ đề:</b> ${X('smartphones')}</p>
 <p>${L('Lợi: giúp giải trí (entertainment)')}</p>
 <p>${H('Hại: làm hại mắt (our eyes)')}</p>
</div>
<p>Cả bài xoay quanh đúng 2 ý này. Không cần ý thứ 3.</p>
${ex('<p>Chủ đề <b>social media</b> (mạng xã hội). Bạn thử chọn 1 lợi và 1 hại bằng tiếng Việt.</p>','<p>Gợi ý: ' + L('Lợi: giữ liên lạc với bạn bè (communication)') + '<br>' + H('Hại: mất nhiều thời gian (our time)') + '</p>')}`);

/* 5 */
S.push(`<h1>MỞ BÀI – Câu 1</h1>
${sent('Khung (học thuộc)', `${F('These days,')} ${X('X')} ${F('can be controversial.')}`, 'Dạo này, X gây tranh cãi.')}
<p>Chỉ làm 1 việc: thay <b>X</b> bằng chủ đề.</p>
${sent('Điền vào', `${F('These days,')} ${X('smartphones')} ${F('can be controversial.')}`)}
${ex('<p>Chủ đề <b>social media</b>. Viết lại cả câu.</p>',`<p>${F('These days,')} ${X('social media')} ${F('can be controversial.')}</p>`)}`);

/* 6 */
S.push(`<h1>MỞ BÀI – Câu 2</h1>
${sent('Khung (học thuộc)', `${F('While some think that')} ${L('[lợi]')}, ${F('I agree with those who feel that')} ${H('[hại]')}.`, 'Trong khi có người nghĩ [lợi], tôi đồng ý với những người cho rằng [hại].')}
<p>Điền ý lợi và ý hại ở slide trước vào:</p>
${sent('Điền vào', `${F('While some think that')} ${L('smartphones can enhance entertainment')}, ${F('I agree with those who feel that')} ${H('smartphones can negatively affect our eyes')}.`, 'Trong khi có người nghĩ điện thoại làm giải trí vui hơn, tôi đồng ý với người cho rằng điện thoại làm hại mắt.')}
<div class="tip">💡 Hai chỗ trống này sẽ dùng lại ở thân bài. Cứ giữ thật chắc 2 ý này.</div>`);

/* 7 */
S.push(`<h1>Bài tập: hoàn thành MỞ BÀI</h1>
<p>Chủ đề <b>social media</b>. Dùng ý đã chọn:</p>
<p>${L('Lợi: can enhance communication')}<br>${H('Hại: can waste our time')}</p>
${ex('<p>Viết đủ <b>2 câu</b> mở bài.</p>',`<p>${F('These days,')} ${X('social media')} ${F('can be controversial. While some think that')} ${L('social media can enhance communication')}, ${F('I agree with those who feel that')} ${H('social media can waste our time')}.</p>`)}`);

/* 8 */
S.push(`<h1>THÂN BÀI 1 (LỢI)<br>Nhớ: Ý – Vì – Ví – Vậy</h1>
<p>Thân bài nào cũng có <b>4 câu</b>, theo thứ tự:</p>
<div class="box">
<p><span class="tag y">Ý</span> <b>Ý</b>: điều lợi là gì?</p>
<p><span class="tag v">Vì</span> <b>Vì</b>: vì sao lại lợi?</p>
<p><span class="tag vi">Ví</span> <b>Ví</b>: cho ví dụ thật.</p>
<p><span class="tag vay">Vậy</span> <b>Vậy</b>: kết quả ra sao?</p>
</div>
<div class="tip">🧠 Đọc to 3 lần: <b>“Ý – Vì – Ví – Vậy”</b>. Phần HẠI cũng làm y chang.</div>`);

/* 9 */
S.push(`<h1>LỢI – câu “Ý”</h1>
${sent('Khung (học thuộc)', `${F('To commence with,')} ${X('X')} ${F('can bring a number of benefits, with the main one being that')} ${L('[ý lợi]')}.`, 'Trước hết, X có thể mang lại nhiều lợi ích, mà lợi ích chính là [ý lợi].')}
<h2>[ý lợi] viết thế nào?</h2>
<p>Chọn 1 trong 2 mẫu:</p>
<div class="box">

/* ---------- engine ---------- */
let i=0;
const main=document.getElementById('main');
function render(){
  main.innerHTML=S[i];window.__onStep&&window.__onStep(i,S[i]);
  main.scrollTop=0;
  document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
  document.getElementById('step').textContent='Bước '+(i+1)+' / '+S.length;
  document.getElementById('prev').disabled=i===0;
  const n=document.getElementById('next');
  n.disabled=i===S.length-1;
  n.textContent=i===S.length-2?'Xem tờ nhớ nhanh →':'Tiếp →';
  if(i===S.length-1)n.textContent='Hết rồi 🎉';
  try{sessionStorage.setItem('pte_i',i)}catch(e){}
}
document.getElementById('next').onclick=()=>{if(i<S.length-1){i++;render()}};
document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};
main.addEventListener('click',e=>{
  const b=e.target.closest('.rv');
  if(!b)return;
  const a=b.nextElementSibling;
  a.hidden=!a.hidden;
  b.textContent=a.hidden?'Xem đáp án':'Ẩn đáp án';
});
let sx=null;
main.addEventListener('touchstart',e=>{sx=e.target.closest&&e.target.closest('.chat')?null:e.touches[0].clientX},{passive:true});
main.addEventListener('touchend',e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(dx)>80){ if(dx<0&&i<S.length-1){i++;render()} else if(dx>0&&i>0){i--;render()} }
},{passive:true});
try{const s=+sessionStorage.getItem('pte_i');if(s>=0&&s<S.length)i=s}catch(e){}
render();

</script>

const BAD_VOICE=/(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|eddy|flo\b|grandma|grandpa|reed|rocko|sandy|shelley)/i;
const PREF_VOICE=[/google us english/i,/(aria|jenny|ava|emma|andrew|brian|guy).*(online|natural)/i,/samantha/i,/\bava\b/i,/allison/i,/\balex\b/i,/google uk english female/i,/daniel/i,/karen/i];
function pickVoice(){
  if(!hasTTS)return;
  const all=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang)&&!BAD_VOICE.test(v.name));
  if(!all.length){tts.voice=null;tts.name='mặc định của máy';return}
  const pools=[all.filter(v=>/en[-_]US/i.test(v.lang)),all.filter(v=>/en[-_]GB/i.test(v.lang)),all];
  let v=null;
  for(const pool of pools){
    if(!pool.length)continue;
    for(const re of PREF_VOICE){v=pool.find(x=>re.test(x.name));if(v)break}
    if(!v)v=pool[0];
    break;
  }
  tts.voice=v;tts.name=v?`${v.name} (${v.lang})`:'mặc định của máy';
}

/* ============ TEXT HELPERS ============ */
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/-/g,' ')
  .replace(/[^a-z0-9'%.\s]/g,' ').replace(/\.(?!\d)/g,' ').split(/\s+/).filter(Boolean)
  .map(w=>w.replace(/^'+|'+$/g,'')).filter(Boolean);
function lcs(a,b){
  const n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ra=new Array(n).fill(false),rb=new Array(m).fill(false);
  let i=0,j=0;
  while(i<n&&j<m){
    if(a[i]===b[j]){ra[i]=rb[j]=true;i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;
  }
  return {refHit:ra,hypHit:rb};
}
function lev(a,b){
  const dp=Array.from({length:a.length+1},(_,i)=>[i,...new Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++)dp[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[a.length][b.length];
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function runRecognition(opts){
  const rec=new SR();
  rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
  const tm={start:performance.now(),first:0,last:0,pauses:0,delay:0};
  let transcript='',confs=[],doneCalled=false,sil=null,nos=null,mx=null,err=null;
  const clearAll=()=>{clearTimeout(sil);clearTimeout(nos);clearTimeout(mx)};
  function finalize(){
    if(doneCalled)return;doneCalled=true;clearAll();
    const conf=confs.length?confs.reduce((a,b)=>a+b,0)/confs.length:0;
    opts.onDone({text:transcript.trim(),conf,tm,error:err});
  }
  function stop(){clearAll();try{rec.stop()}catch(e){finalize()}}
  rec.onresult=e=>{
    const now=performance.now();
    if(!tm.first){tm.first=now;tm.delay=(now-tm.start)/1000;clearTimeout(nos)}
    else if(now-tm.last>1400)tm.pauses++;
    tm.last=now;
    let t='';const cs=[];
    for(let i=0;i<e.results.length;i++){
      const r=e.results[i];t+=r[0].transcript+' ';
      if(r.isFinal&&r[0].confidence>0)cs.push(r[0].confidence);
    }
    transcript=t;confs=cs;
    opts.onUpdate&&opts.onUpdate(t);
    clearTimeout(sil);sil=setTimeout(stop,opts.silenceMs||2200);
  };
  rec.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')err=e.error};
  rec.onend=finalize;
  try{rec.start()}catch(e){err='start-failed';finalize();return {stop(){}}}
  opts.onStart&&opts.onStart();
  nos=setTimeout(stop,7000);
  mx=setTimeout(stop,opts.maxMs||20000);
  return {stop,abort(){doneCalled=true;clearAll();try{rec.abort()}catch(e){}}};
}

/* ============ MIC RECORDER + AUDIO STORE + HISTORY ============ */
async function startMic(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m));
  const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  const chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  let an=null,src=null;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=256;src.connect(an);
  }catch(e){an=null}
  const p=new Promise(res=>{mr.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    try{src&&src.disconnect()}catch(e){}
    res(new Blob(chunks,{type:mr.mimeType||'audio/webm'}));
  }});
  mr.start();
  return {
    stop(){try{if(mr.state!=='inactive')mr.stop()}catch(e){}return p},
    level(){
      if(!an)return 0;
      const d=new Uint8Array(an.fftSize);an.getByteTimeDomainData(d);
      let s=0;for(let i=0;i<d.length;i++){const x=(d[i]-128)/128;s+=x*x}
      return Math.min(1,Math.sqrt(s/d.length)*4);
    }
  };
}

/* ============ PTE-STYLE SCORING (RS) ============ */
function scoreRS(ref,hyp,conf,tm){
  const r=norm(ref),h=norm(hyp);
  const {refHit}=lcs(r,h);
  const hit=refHit.filter(Boolean).length;
  const ratio=r.length?hit/r.length:0;
  const content=ratio>=0.9?3:ratio>=0.5?2:ratio>0.15?1:0;
  let fluency=0,pron=0;
  if(h.length){
    let pr=conf>0?clamp((conf-0.55)/0.4,0,1):ratio;
    pr*=0.4+0.6*Math.min(1,ratio/0.9);
    pron=Math.round(pr*5);
    const dur=Math.max(0.6,(tm.last-tm.first)/1000+0.4);
    const spw=dur/Math.max(1,h.length);
    const rate=spw<0.2?0.6:spw<=0.7?1:spw<=1.2?1-(spw-0.7)/0.5*0.7:0.15;
    const pen=Math.min(0.6,tm.pauses*0.18)+(tm.delay>3?0.2:0);
    const fl=rate*(1-pen)*(0.35+0.65*Math.min(1,ratio/0.9));
    fluency=Math.round(clamp(fl,0,1)*5);
  }
  return {content,fluency,pron,total:content+fluency+pron,ratio,refHit,r};
}

/* ===== PDF -> sentence list (runs in the browser with pdf.js) ===== */
async function parsePdfFile(pdfjsLib,data,onProgress){
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(data)}).promise;
  const VI=/[ăâđêôơưàáạảãầấậẩẫằắặẳẵèéẹẻẽềếệểễìíịỉĩòóọỏõồốộổỗờớợởỡùúụủũừứựửữỳýỵỷỹ]/i;
  let kind=null,declared=null,sawFont=false;
  const pages=[],viFont=new Set();
  for(let p=1;p<=pdf.numPages;p++){
    onProgress&&onProgress(p,pdf.numPages);
    const page=await pdf.getPage(p);
    try{await page.getOperatorList()}catch(e){}
    const tc=await page.getTextContent();
    if(p===1){
      const flat=tc.items.filter(i=>i.str&&i.str.trim()).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).map(i=>i.str).join('').replace(/\s+/g,'');
      if(/repeatsentence/i.test(flat.slice(0,200)))kind='rs';else if(/writefromdictation/i.test(flat.slice(0,200)))kind='wfd';else if(/writeessay/i.test(flat.slice(0,200)))kind='essay';
      const m=flat.match(/T[ổo]ngs[ốo]:?(\d+)/i);if(m)declared=+m[1];
    }
    const frags=[];
    for(const it of tc.items){
      if(!it.str||!it.str.trim())continue;
      const t=it.transform,size=Math.hypot(t[2],t[3]);
      const isH=size>=12.2&&size<13.25,isB=size>=13.3&&size<14.6;
      if(!isH&&!isB)continue;
      let nm='';try{nm=page.commonObjs.get(it.fontName).name||''}catch(e){}
      if(nm)sawFont=true;
      if(isB&&VI.test(it.str))viFont.add(it.fontName);
      frags.push({isH,fid:it.fontName,ital:/italic|oblique/i.test(nm),x:t[4],y:t[5],w:it.width||0,size,s:it.str});
    }
    pages.push(frags);
  }
  const items=[];let cur=null;
  for(const frags of pages){
    for(const f of frags)f.cat=f.isH?'H':(VI.test(f.s)||f.ital||viFont.has(f.fid))?'V':'E';
    const rows=[];
    for(const c of ['H','E','V']){
      const fs=frags.filter(f=>f.cat===c).sort((a,b)=>b.y-a.y||a.x-b.x);
      let row=null;
      for(const f of fs){
        if(!row||Math.abs(row.y-f.y)>f.size*0.4){row={cat:c,y:f.y,parts:[]};rows.push(row)}
        row.parts.push(f);
      }
    }
    const lines=rows.map(r=>{
      r.parts.sort((a,b)=>a.x-b.x);
      let text='',end=null;
      for(const f of r.parts){
        if(end!==null&&f.x-end>f.size*0.12&&!text.endsWith(' ')&&!f.s.startsWith(' '))text+=' ';
        text+=f.s;end=f.x+f.w;
      }
      return {y:r.y,cat:r.cat,text:text.replace(/\s+/g,' ').trim()};
    }).filter(l=>l.text).sort((a,b)=>b.y-a.y);
    for(const l of lines){
      if(l.cat==='H'){
        const m=l.text.match(/^(\d+)\.(?:\s*ID:\s*(\d+))?$/);
        if(!m)continue;
        const n=+m[1];
        if(cur&&cur.n===n){if(m[2])cur.id=+m[2];continue}
        cur={n,id:m[2]?+m[2]:null,en:[],vi:[]};items.push(cur);
      }else if(cur){
        const L=l.cat==='E'?cur.en:cur.vi;
        if(L.length&&L[L.length-1]===l.text)continue;
        L.push(l.text);
      }
    }
  }
  const out=items.map(it=>{const d={n:it.n,en:it.en.join(' ').trim(),vi:it.vi.join(' ').trim()};if(it.id)d.id=it.id;return d}).filter(d=>d.en);
  return {kind,items:out,declared,sawFont,pages:pdf.numPages};
}

/* ============ SOURCE FILES: generic readers ============ */
const VI_RE=/[ăâđêôơưàáạảãầấậẩẫằắặẳẵèéẹẻẽềếệểễìíịỉĩòóọỏõồốộổỗờớợởỡùúụủũừứựửữỳýỵỷỹ]/i;
function linesToItem(lines){
  lines=lines.map(l=>l.trim()).filter(l=>l&&!/^ID:\s*\d+$/i.test(l));
  if(!lines.length)return null;
  const idx=lines.findIndex(l=>VI_RE.test(l));
  const en=(idx<0?lines:lines.slice(0,idx)).join(' ').replace(/\s+/g,' ').replace(/^ID:\s*\d+\s*/i,'').trim();
  const vi=idx<=0?'':lines.slice(idx).join(' ').replace(/\s+/g,' ').trim();
  if(!en||en.split(' ').length<6||en.length<30)return null;
  return {en,vi};
}
function splitPrompts(text){
  text=String(text).replace(/\r/g,'').replace(/\u00a0/g,' ');
  const lines=text.split('\n');
  const numRe=/^\s*#?\s*(\d{1,3})\s*[.):\-]\s*(.*)$/;
  let blocks=[];
  if(lines.filter(l=>numRe.test(l)).length>=3){
    let cur=null;
    for(const l of lines){
      const m=l.match(numRe);
      if(m){if(cur)blocks.push(cur);cur=[m[2]]}
      else if(cur&&l.trim())cur.push(l);
    }
    if(cur)blocks.push(cur);
  }else{
    blocks=text.split(/\n\s*\n+/).map(b=>b.split('\n'));
    if(blocks.length<3)blocks=lines.map(l=>[l]);
  }
  const seen=new Set(),out=[];
  blocks.forEach(b=>{
    const it=linesToItem(b);if(!it)return;
    const k=it.en.toLowerCase();if(seen.has(k))return;seen.add(k);
    out.push({n:out.length+1,en:it.en,vi:it.vi});
  });
  return out;
}
function parseCsv(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===','||c===';'||c==='\t'){row.push(cell);cell=''}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
    else if(c!=='\r')cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function csvItems(text){
  const rows=parseCsv(text);if(!rows.length)return [];
  const h=rows[0].map(x=>x.trim().toLowerCase());
  let en=h.findIndex(x=>/^(en|english|prompt|question|topic|de|đề|cau|câu)$/.test(x));
  let vi=h.findIndex(x=>/(^vi$|việt|viet|dịch|dich|translation)/.test(x));
  let data=rows;
  if(en>=0||vi>=0){data=rows.slice(1);if(en<0)en=0}else{en=0;vi=rows[0].length>1?1:-1}
  const seen=new Set(),out=[];
  data.forEach(r=>{
    const e=(r[en]||'').replace(/\s+/g,' ').trim();
    if(e.split(' ').length<6||seen.has(e.toLowerCase()))return;
    seen.add(e.toLowerCase());
    out.push({n:out.length+1,en:e,vi:vi>=0?(r[vi]||'').trim():''});
  });
  return out;
}
async function pdfPlainText(lib,buf,onProgress){
  const pdf=await lib.getDocument({data:new Uint8Array(buf)}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    onProgress&&onProgress(p,pdf.numPages);
    const page=await pdf.getPage(p);const tc=await page.getTextContent();
    const frags=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0,size:Math.hypot(it.transform[2],it.transform[3])||10}));
    frags.sort((a,b)=>b.y-a.y||a.x-b.x);
    const rows=[];let row=null;
    for(const f of frags){if(!row||Math.abs(row.y-f.y)>f.size*0.5){row={y:f.y,size:f.size,parts:[]};rows.push(row)}row.parts.push(f)}
    let prev=null;
    for(const r of rows){
      r.parts.sort((a,b)=>a.x-b.x);
      let t='',end=null;
      for(const f of r.parts){if(end!==null&&f.x-end>f.size*0.12&&!t.endsWith(' ')&&!f.s.startsWith(' '))t+=' ';t+=f.s;end=f.x+f.w}
      t=t.replace(/\s+/g,' ').trim();
      if(!t||/ptescoreup/i.test(t)||/^page \d+ of \d+$/i.test(t)||/^https?:\/\//i.test(t))continue;
      if(prev!==null&&prev-r.y>r.size*2.1)out.push('');
      out.push(t);prev=r.y;
    }
    out.push('');
  }
  return out.join('\n');
}
/* one entry point for every file the user can upload */
async function parseSourceFile(file,startKind,onProgress){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf'||file.type==='application/pdf'){
    const lib=await loadPdfJs();
    const buf=await file.arrayBuffer();
    let r=null;
    try{r=await parsePdfFile(lib,buf,onProgress)}catch(e){r=null}
    if(r&&r.items.length)return {kind:r.kind||startKind,items:r.items,declared:r.declared,guess:!r.kind};
    const items=splitPrompts(await pdfPlainText(lib,buf,onProgress));
    return {kind:startKind,items,declared:null,guess:true};
  }
  if(!['txt','md','csv','tsv','text'].includes(ext))throw new Error('Định dạng .'+ext+' chưa được hỗ trợ. Hãy dùng PDF, TXT hoặc CSV.');
  const text=await file.text();
  const items=ext==='csv'||ext==='tsv'?csvItems(text):splitPrompts(text);
  return {kind:startKind,items,declared:null,guess:true};
}

const newId=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load fail'));document.head.appendChild(s)})}
async function loadPdfJs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  const V='3.11.174';
  const srcs=[
    [`https://cdn.jsdelivr.net/npm/pdfjs-dist@${V}/build/pdf.min.js`,`https://cdn.jsdelivr.net/npm/pdfjs-dist@${V}/build/pdf.worker.min.js`],
    [`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${V}/pdf.min.js`,`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${V}/pdf.worker.min.js`]
  ];
  for(const [s,w] of srcs){
    try{await loadScript(s);window.pdfjsLib.GlobalWorkerOptions.workerSrc=w;return window.pdfjsLib}catch(e){}
  }
  throw new Error('Không tải được thư viện đọc PDF. Hãy kiểm tra kết nối mạng rồi thử lại.');
}

/* a new file overrides older active files of the same kind that share its file name or display name */
function overrideTargets(kind,fileName,name){
  const fn=(fileName||'').trim().toLowerCase(),nm=(name||'').trim().toLowerCase();
  return userSets[kind].filter(s=>isActive(s)&&((fn&&(s.fileName||'').trim().toLowerCase()===fn)||(nm&&s.name.trim().toLowerCase()===nm)));
}
function addSets(list,nm,disableOld){
  const added=[],disabled=[];
  list.forEach(p=>{
    const id=newId();
    if(disableOld)overrideTargets(p.kind,p.file,nm).forEach(s=>{s.status='disabled';s.replacedBy=id;s.disabledAt=Date.now();disabled.push(`${s.name} (${KIND_LABEL[p.kind]})`)});
    userSets[p.kind].push({id,name:nm,fileName:p.file,created:Date.now(),status:'active',items:p.items});
    if(p.kind!=='essay'){curSet[p.kind]=id;resetIdx(p.kind)}
    added.push(`${KIND_LABEL[p.kind]}: ${p.items.length} câu`);
  });
  return {added,disabled};
}
function resetIdx(kind){if(kind==='rs'){rsIdx=0;store.set('rs_idx',0)}else if(kind==='wfd'){wfIdx=0;store.set('wf_idx',0)}}
function renderSetBar(kind,rerender){
  const host=$('#'+kind+'-setbar');
  const arr=setsOf(kind),cur=SET(kind);
  host.innerHTML=`<span class="si" aria-hidden="true">📚</span><select aria-label="Chọn bộ đề">${arr.map(s=>`<option value="${esc(s.id)}"${s.id===cur.id?' selected':''}>${esc(s.name)} · ${s.items.length} câu</option>`).join('')}</select><button class="btn pri" data-a="manage">＋ Thêm file</button>`;
  host.querySelector('select').onchange=e=>{curSet[kind]=e.target.value;store.set('pte_curset',curSet);resetIdx(kind);rerender()};
  host.querySelector('[data-a=manage]').onclick=()=>openSets(kind);
}
function rerenderActive(){if(curTab==='rs')renderRS();else if(curTab==='wfd')renderWFD();else renderES()}

/* ----- file history tab (shared by the 3 tabs) ----- */
function openSetViewer(kind,s){
  const root=$('#modal-root');let q='',shown=30;
  root.innerHTML=`<div class="ov" data-a="bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Nội dung file đề">
   <div class="sheet-h"><span>👁 ${esc(s.name)}</span><button class="x" data-a="close" aria-label="Đóng">✕</button></div>
   <div class="sheet-b"><div class="note">${KIND_LABEL[kind]} · ${s.items.length} câu${s.fileName?' · '+esc(s.fileName):''}</div>
   <div class="searchbox" style="margin:8px 0"><input type="search" placeholder="Tìm trong file…" aria-label="Tìm trong file"></div>
   <div data-a="cnt" class="count"></div><div data-a="list"></div><button class="btn more" data-a="more">Xem thêm</button></div></div></div>`;
  document.body.style.overflow='hidden';
  const qq=a=>root.querySelector(`[data-a=${a}]`);
  const close=()=>{root.innerHTML='';document.body.style.overflow=''};
  qq('close').onclick=close;root.querySelector('.ov').addEventListener('click',e=>{if(e.target.dataset.a==='bg')close()});
  root.onkeydown=e=>{if(e.key==='Escape')close()};
  function draw(){
    const t=q.trim().toLowerCase();
    const f=s.items.filter(it=>!t||it.en.toLowerCase().includes(t)||(it.vi||'').toLowerCase().includes(t));
    qq('cnt').textContent=`Đang hiện ${Math.min(shown,f.length)}/${f.length}`;
    qq('list').innerHTML=f.slice(0,shown).map(it=>`<div class="item"><div class="top"><span class="num">#${it.n}${it.id?' · ID '+it.id:''}</span></div><div class="en">${esc(it.en)}</div>${it.vi?`<div class="vi">${esc(it.vi)}</div>`:''}</div>`).join('')||'<div class="empty">Không có kết quả.</div>';
    qq('more').hidden=shown>=f.length;
  }
  root.querySelector('input').oninput=e=>{q=e.target.value;shown=30;draw()};
  qq('more').onclick=()=>{shown+=30;draw()};
  draw();
}
function renderFiles(kind,body){
  const base=allSets(kind)[0];
  const list=[...userSets[kind]].sort((a,b)=>(b.created||0)-(a.created||0));
  const nameOfId=id=>{const s=userSets[kind].find(x=>x.id===id);return s?s.name:'file mới hơn'};
  const row=(s,builtin)=>{
    const act=isActive(s);
    return `<article class="fcard${act?'':' dis'}" data-id="${esc(s.id)}">
     <div class="fc-top"><span class="fc-ic" aria-hidden="true">📄</span>
      <div class="fc-main"><b>${esc(s.name)}</b><span class="fc-sub">${builtin?'Có sẵn trong app':esc(s.fileName||'không rõ tên file')} · ${s.items.length} câu${s.created?' · '+new Date(s.created).toLocaleDateString('vi-VN'):''}</span></div>
      <span class="st ${act?'on':'off'}">${act?'🟢 Đang bật':'⚪ Disabled'}</span></div>
     ${!act&&s.replacedBy?`<div class="note" style="margin:6px 0 0">Bị đè bởi: <b>${esc(nameOfId(s.replacedBy))}</b></div>`:(!act?'<div class="note" style="margin:6px 0 0">Đã tắt thủ công.</div>':'')}
     <div class="fc-acts"><button data-a="view">👁 Xem</button>${act&&(kind!=='essay'||true)?'<button data-a="use">▶ Dùng</button>':''}${builtin?'':`<button data-a="toggle">${act?'Tắt':'Bật lại'}</button><button class="del" data-a="del">🗑 Xoá</button>`}</div></article>`;
  };
  body.innerHTML=`<div class="files-head"><div><b>📁 Lịch sử file đề</b><div class="note" style="margin:2px 0 0">${KIND_LABEL[kind]} · ${userSets[kind].length} file đã tải</div></div><button class="btn pri sm" data-a="add">＋ Thêm file</button></div>
   <p class="note">Tải file mới <b>cùng tên file hoặc cùng tên đề</b> sẽ đè lên file cũ: file cũ chuyển sang <b>Disabled</b> (không còn dùng được nhưng vẫn xem, bật lại hoặc xoá được).</p>
   <div class="flist">${row(Object.assign({},base,{items:D[kind]}),true)}${list.map(s=>row(s,false)).join('')||'<div class="empty"><b>Chưa có file nào</b>Bấm “＋ Thêm file” để tải file đề đầu tiên.</div>'}</div>`;
  body.querySelector('[data-a=add]').onclick=()=>openSets(kind);
  body.querySelector('.flist').onclick=e=>{
    const b=e.target.closest('button[data-a]');if(!b)return;
    const card=b.closest('.fcard');const id=card.dataset.id;
    const s=allSets(kind).find(x=>x.id===id);if(!s)return;
    const a=b.dataset.a;
    if(a==='view'){openSetViewer(kind,s);return}
    if(a==='use'){
      if(kind==='essay'){essSel=s.id;store.set('pte_ess_sel',essSel);essPick(true);esMode='practice';store.set('es_mode',esMode);renderES()}
      else{curSet[kind]=id;store.set('pte_curset',curSet);resetIdx(kind);if(kind==='rs'){rsMode='practice';store.set('rs_mode',rsMode);renderRS()}else{wfMode='type';store.set('wf_mode',wfMode);renderWFD()}}
      return;
    }
    if(a==='toggle'){
      s.status=isActive(s)?'disabled':'active';
      if(s.status==='active'){delete s.replacedBy}else{s.disabledAt=Date.now();delete s.replacedBy}
      persistSets();renderFiles(kind,body);return;
    }
    if(a==='del'){
      if(!confirm(`Xoá file “${s.name}”? ${kind==='essay'?'':'Điểm và lịch sử luyện của file này cũng sẽ bị xoá. '}Không thể hoàn tác.`))return;
      userSets[kind]=userSets[kind].filter(x=>x.id!==id);persistSets();
      if(kind!=='essay'){
        if(curSet[kind]===id){curSet[kind]='base';store.set('pte_curset',curSet);resetIdx(kind)}
        Object.keys(scores[kind]).forEach(key=>{if(key.startsWith(id+'_'))delete scores[kind][key]});store.set('pte_scores',scores);
        if(kind==='rs'){hist.filter(h=>h.s===id).forEach(h=>{if(h.a)idb.del(h.id)});hist=hist.filter(h=>h.s!==id);store.set('pte_hist_rs',hist)}
      }else if(essSel===id){essSel='all';store.set('pte_ess_sel',essSel);essPick(true)}
      renderFiles(kind,body);
    }
  };
}

/* ----- upload dialog ----- */
function openSets(startKind){
  stopAll();
  const root=$('#modal-root');
  let pending=[],nameVal='',keepOld=false;
  root.innerHTML=`<div class="ov" data-a="bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="sheet-h"><span id="sh-t">📚 Thêm file đề</span><button class="x" data-a="close" aria-label="Đóng">✕</button></div>
    <div class="sheet-b">
      <p class="note">Tải file đề của tháng này: <b>PDF</b> xuất từ ptescoreup (Repeat Sentence, Write from Dictation, Write Essay; chọn nhiều file cùng lúc được) hoặc file <b>TXT/CSV</b> chứa danh sách đề. App tự nhận loại file; file lạ sẽ lấy theo tab đang mở (${KIND_LABEL[startKind]}), bạn kiểm tra lại ở ô chọn loại.</p>
      <label class="fl">Tên đề<input type="text" class="txt" data-a="name" placeholder="Ví dụ: Đề tháng 9" maxlength="60"></label>
      <label class="btn filebtn">📄 Chọn file<input type="file" accept="application/pdf,.pdf,.txt,.md,.csv,.tsv,text/plain,text/csv" multiple hidden data-a="file"></label>
      <div data-a="pending"></div>
      <div data-a="ovr"></div>
      <div data-a="msg"></div>
      <button class="btn pri" data-a="save" disabled style="width:100%">Lưu file</button>
      <div class="btns" style="margin-top:10px"><button class="btn sm" data-a="hist">📁 Xem lịch sử file</button></div>
      <div class="sec">Chuyển sang máy khác</div>
      <p class="note">File đề lưu trong trình duyệt của máy này. Muốn dùng trên máy khác: xuất file ở đây rồi nhập vào máy kia.</p>
      <div class="btns"><button class="btn sm" data-a="exp">⬇ Xuất tất cả</button><label class="btn sm filebtn" style="margin:0">⬆ Nhập file<input type="file" accept=".json,application/json" hidden data-a="imp"></label></div>
    </div></div></div>`;
  document.body.style.overflow='hidden';
  const q=a=>root.querySelector(`[data-a=${a}]`);
  const close=()=>{root.innerHTML='';document.body.style.overflow='';rerenderActive()};
  q('close').onclick=close;
  root.querySelector('.ov').addEventListener('click',e=>{if(e.target.dataset.a==='bg')close()});
  root.onkeydown=e=>{if(e.key==='Escape')close()};
  q('close').focus();
  q('hist').onclick=()=>{
    if(startKind==='rs'){rsMode='files';store.set('rs_mode',rsMode)}
    else if(startKind==='wfd'){wfMode='files';store.set('wf_mode',wfMode)}
    else{esMode='files';store.set('es_mode',esMode)}
    close();
  };
  function updateSave(){
    const ok=pending.some(p=>p.status==='ok'),busy=pending.some(p=>p.status==='reading');
    q('save').disabled=!ok||busy||!nameVal.trim();
  }
  function drawPending(){
    q('pending').innerHTML=pending.map((p,i)=>{
      const cls=p.status==='ok'?(p.declared&&p.declared!==p.items.length?'warn':'ok'):p.status==='err'?'err':'';
      let msg=p.msg;
      if(p.status==='ok')msg=`✓ Đọc được ${p.items.length} câu`+(p.declared&&p.declared!==p.items.length?` (file ghi ${p.declared} câu, hãy kiểm tra lại)`:'')+(p.guess?' · không nhận ra loại file, đã chọn theo tab hiện tại':'');
      return `<div class="pf"><div class="pf-n">📄 ${esc(p.file)}</div><div class="pf-s ${cls}">${esc(msg)}</div>${p.status==='ok'?`<div class="note" style="margin:0 0 6px">Câu đầu: ${esc(p.items[0].en.slice(0,160))}</div><select data-i="${i}" aria-label="Loại đề">${KINDS.map(k=>`<option value="${k}"${p.kind===k?' selected':''}>${KIND_LABEL[k]}</option>`).join('')}</select>`:''}</div>`;
    }).join('');
    const ok=pending.filter(p=>p.status==='ok');
    const tg=[];
    ok.forEach(p=>overrideTargets(p.kind,p.file,nameVal).forEach(s=>tg.push(`“${s.name}” (${KIND_LABEL[p.kind]}${s.fileName&&s.fileName.toLowerCase()===p.file.toLowerCase()?', cùng tên file':', cùng tên đề'})`)));
    q('ovr').innerHTML=tg.length?`<div class="warnbox"><b>Sẽ bị đè:</b> ${tg.map(esc).join('; ')}.<br>Các file cũ này sẽ chuyển sang <b>Disabled</b>.<label class="keep" style="justify-content:flex-start;margin-top:6px"><input type="checkbox" data-a="keep"${keepOld?' checked':''}><span>Giữ cả file cũ (không disable)</span></label></div>`:'';
    const kb=q('keep');if(kb)kb.onchange=()=>{keepOld=kb.checked};
    updateSave();
  }
  q('pending').onchange=e=>{const s=e.target.closest('select[data-i]');if(s){pending[+s.dataset.i].kind=s.value;pending[+s.dataset.i].guess=false;drawPending()}};
  q('name').oninput=e=>{nameVal=e.target.value;drawPending()};
  q('file').onchange=async e=>{
    const files=[...e.target.files];e.target.value='';
    q('msg').innerHTML='';
    for(const f of files){
      const p={file:f.name,status:'reading',msg:'Đang chuẩn bị…',kind:null,items:[]};
      pending.push(p);
      if(!nameVal.trim()){nameVal=f.name.replace(/\.[a-z0-9]+$/i,'').replace(/[_-]+/g,' ').trim();q('name').value=nameVal}
      drawPending();
      try{
        const r=await parseSourceFile(f,startKind,(a,b)=>{p.msg=`Đang đọc trang ${a}/${b}…`;drawPending()});
        if(!r.items.length)throw new Error('Không tách được đề nào từ file này. Hãy kiểm tra file có chữ (không phải ảnh scan) và mỗi đề cách nhau một dòng trống hoặc đánh số.');
        p.kind=r.kind;p.guess=r.guess;p.items=r.items;p.declared=r.declared;p.status='ok';
      }catch(err){p.status='err';p.msg=err&&err.message?err.message:'Lỗi đọc file'}
      drawPending();
    }
  };
  q('save').onclick=()=>{
    const nm=nameVal.trim();if(!nm)return;
    const snapshot=JSON.stringify(userSets),snapCur=JSON.stringify(curSet);
    const res=addSets(pending.filter(p=>p.status==='ok'),nm,!keepOld);
    if(!persistSets()){
      userSets=JSON.parse(snapshot);curSet=JSON.parse(snapCur);
      q('msg').innerHTML='<div class="warnbox">Bộ nhớ trình duyệt đã đầy nên chưa lưu được. Hãy xoá bớt file cũ ở “📁 File đề” rồi thử lại.</div>';return;
    }
    store.set('pte_curset',curSet);
    pending=[];nameVal='';q('name').value='';drawPending();
    q('msg').innerHTML=`<div class="okmsg">✅ Đã lưu “${esc(nm)}”.<br>${res.added.map(esc).join('<br>')}${res.disabled.length?`<br>⚪ Đã chuyển sang Disabled: ${res.disabled.map(esc).join('; ')}`:''}</div>`;
  };
  q('exp').onclick=()=>{
    const blob=new Blob([JSON.stringify({app:'pte-trainer',v:2,sets:userSets})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pte-bo-de.json';document.body.appendChild(a);a.click();a.remove();
  };
  q('imp').onchange=async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{
      const j=JSON.parse(await f.text());
      if(!j||j.app!=='pte-trainer'||!j.sets)throw new Error('bad');
      let n=0;
      KINDS.forEach(k=>{(j.sets[k]||[]).forEach(s=>{
        if(!s||!Array.isArray(s.items)||!s.items.length||!s.items.every(x=>x&&typeof x.en==='string'))return;
        let id=String(s.id||'');if(!id||id==='base'||allSets(k).some(x=>x.id===id))id=newId();
        userSets[k].push({id,name:String(s.name||'Đề nhập').slice(0,60),fileName:s.fileName||'',created:s.created||Date.now(),status:s.status==='disabled'?'disabled':'active',replacedBy:s.replacedBy,items:s.items.map((x,i)=>({n:x.n||i+1,en:x.en,vi:String(x.vi||''),...(x.id?{id:x.id}:{})}))});n++;
      })});
      if(!n)throw new Error('empty');
      persistSets();q('msg').innerHTML=`<div class="okmsg">✅ Đã nhập ${n} file đề.</div>`;
    }catch(err){q('msg').innerHTML='<div class="warnbox">File không hợp lệ. Hãy chọn file .json đã xuất từ app này.</div>'}
  };
  drawPending();
}

/* ============ AI LAYER ============ */
const AI=(()=>{
  const PROVIDERS={
    anthropic:{name:'Claude (Anthropic)',short:'Claude',keyUrl:'https://console.anthropic.com/settings/keys',keyHost:'console.anthropic.com',hint:'sk-ant-…',models:['claude-sonnet-5-5','claude-opus-5-5','claude-haiku-4-5-20251001'],def:'claude-sonnet-5-5',note:'API tính tiền riêng, không dùng chung với gói Claude Pro/Max.'},
    openai:{name:'ChatGPT (OpenAI)',short:'ChatGPT',keyUrl:'https://platform.openai.com/api-keys',keyHost:'platform.openai.com',hint:'sk-…',models:['gpt-4.1','gpt-4o','gpt-4o-mini','gpt-5'],def:'gpt-4.1',note:'Cần tài khoản API riêng ở platform.openai.com, không dùng chung với gói ChatGPT Plus.'},
    gemini:{name:'Gemini (Google)',short:'Gemini',keyUrl:'https://aistudio.google.com/apikey',keyHost:'aistudio.google.com',hint:'AIza…',models:['gemini-2.5-pro','gemini-2.5-flash','gemini-2.0-flash'],def:'gemini-2.5-pro',note:'Lấy key ở Google AI Studio.'}
  };
  function cfg(){
    const raw=store.get('pte_ai',{});
    const c={provider:PROVIDERS[raw.provider]?raw.provider:'anthropic',
      keys:Object.assign({anthropic:'',openai:'',gemini:''},raw.keys||{}),
      models:{anthropic:PROVIDERS.anthropic.def,openai:PROVIDERS.openai.def,gemini:PROVIDERS.gemini.def}};
    Object.assign(c.models,raw.models||{});
    if(raw.key&&!c.keys.anthropic){c.keys.anthropic=raw.key;if(raw.model)c.models.anthropic=raw.model}
    return c;
  }
  const setCfg=c=>store.set('pte_ai',c);
  function effective(){
    const c=cfg();
    let p=c.provider;
    if(!c.keys[p]){p=Object.keys(PROVIDERS).find(k=>c.keys[k]);if(!p)return null}
    return {provider:p,key:c.keys[p],model:c.models[p]||PROVIDERS[p].def};
  }
  let sp=null;
  function getSample(){
    if(sp)return sp;
    sp=(async()=>{
      try{if(window.claude&&typeof window.claude.use==='function'){const s=await window.claude.use('sample');return s||null}}catch(e){}
      return null;
    })();
    return sp;
  }
  async function mode(){if(effective())return 'key';return (await getSample())?'sample':null}
  function label(){
    const e=effective();
    if(e)return PROVIDERS[e.provider].short+' · '+e.model;
    return 'Claude (tài khoản của bạn)';
  }
  const netErr=()=>({code:'network',message:'Không kết nối được tới AI. Kiểm tra mạng rồi thử lại (một số trình duyệt/mạng chặn gọi trực tiếp tới nhà cung cấp).'});
  function httpErr(status,text){
    const base={400:'Yêu cầu bị từ chối.',401:'API key không đúng hoặc đã bị thu hồi.',403:'API key không có quyền hoặc chưa bật thanh toán.',404:'Tên model không đúng hoặc tài khoản chưa có model này.',429:'Hết hạn mức hoặc gửi quá nhanh, chờ một lúc rồi thử lại.',500:'Dịch vụ AI đang lỗi, thử lại sau.',503:'Dịch vụ AI đang quá tải, thử lại sau.',529:'Dịch vụ AI đang quá tải, thử lại sau.'};
    return {code:'http_'+status,message:(base[status]||('Lỗi '+status+'.'))+' Vào ⚙ Cài đặt AI để kiểm tra key/model.'+(text?' ('+String(text).slice(0,160)+')':'')};
  }
  const errText=async r=>{try{const j=await r.json();return (j.error&&(j.error.message||j.error))||j.message||''}catch(e){return ''}};

  async function callAnthropic(e,o){
    const body={model:e.model,max_tokens:o.maxTokens,system:o.system,messages:o.msgs};
    if(o.temperature!=null)body.temperature=o.temperature;
    for(let k=0;k<2;k++){
      let r;
      try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':e.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}catch(x){throw netErr()}
      if(r.ok){const j=await r.json();return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('')}
      const t=await errText(r);
      if(r.status===400&&/temperature/i.test(String(t))&&'temperature' in body){delete body.temperature;continue}
      throw httpErr(r.status,t);
    }
  }
  async function callOpenAI(e,o){
    const reasoning=/^(o\d|gpt-5)/i.test(e.model);
    const body={model:e.model,messages:[{role:'system',content:o.system},...o.msgs],max_completion_tokens:reasoning?o.maxTokens*3:o.maxTokens};
    if(o.json)body.response_format={type:'json_object'};
    if(o.temperature!=null&&!reasoning)body.temperature=o.temperature;
    for(let k=0;k<4;k++){
      let r;
      try{r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+e.key},body:JSON.stringify(body)})}catch(x){throw netErr()}
      if(r.ok){
        const j=await r.json();
        const t=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
        if(!t)throw {code:'empty',message:'AI không trả về nội dung (có thể bị cắt do hết token). Hãy bấm thử lại hoặc đổi model.'};
        return t;
      }
      const t=String(await errText(r));
      if(r.status===400){
        if(/temperature/i.test(t)&&'temperature' in body){delete body.temperature;continue}
        if(/response_format/i.test(t)&&body.response_format){delete body.response_format;continue}
        if(/max_completion_tokens/i.test(t)&&body.max_completion_tokens){body.max_tokens=body.max_completion_tokens;delete body.max_completion_tokens;continue}
      }
      throw httpErr(r.status,t);
    }
    throw {code:'retry',message:'Model này không nhận tham số chuẩn. Hãy thử model khác.'};
  }
  async function callGemini(e,o){
    const model=e.model.replace(/^models\//,'');
    const gen={maxOutputTokens:o.maxTokens*3};
    if(o.temperature!=null)gen.temperature=o.temperature;
    if(o.json)gen.responseMimeType='application/json';
    const body={systemInstruction:{parts:[{text:o.system}]},contents:o.msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]})),generationConfig:gen};
    for(let k=0;k<2;k++){
      let r;
      try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(e.key)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})}catch(x){throw netErr()}
      if(!r.ok){
        const t=String(await errText(r));
        if(r.status===400&&/mime|responseMimeType/i.test(t)&&gen.responseMimeType){delete gen.responseMimeType;continue}
        throw httpErr(r.status,t);
      }
      const j=await r.json();
      const c=(j.candidates||[])[0];
      const t=c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||'').join(''):'';
      if(!t){const why=(j.promptFeedback&&j.promptFeedback.blockReason)||(c&&c.finishReason)||'';throw {code:'empty',message:'Gemini không trả về nội dung'+(why?' ('+why+')':'')+'. Hãy bấm thử lại hoặc đổi model.'}}
      return t;
    }
  }
  async function ask({system,messages,maxTokens=1500,json=false,temperature=null}){
    let msgs=messages.slice();
    while(msgs.length&&msgs[0].role!=='user')msgs.shift();
    msgs=msgs.reduce((a,x)=>{const l=a[a.length-1];if(l&&l.role===x.role)l.content+='\n\n'+x.content;else a.push({role:x.role,content:x.content});return a},[]);
    if(!msgs.length||msgs[msgs.length-1].role!=='user')throw {code:'bad_input',message:'Thiếu nội dung gửi AI'};
    const e=effective();
    const o={system,msgs,maxTokens,json,temperature};
    if(e){
      if(e.provider==='anthropic')return callAnthropic(e,o);
      if(e.provider==='openai')return callOpenAI(e,o);
      return callGemini(e,o);
    }
    const s=await getSample();
    if(s){
      const inp=msgs.map((x,i)=>i===0?{role:'user',content:system+'\n\n=====\n'+x.content}:x);
      try{const r=await s(inp,{modelTier:'default',cache:false});return r.text}
      catch(err){throw {code:err&&err.code||'sample',message:err&&err.code==='not_granted'?'Bạn chưa cho phép dùng AI trong trang này.':(err&&err.message)||'Lỗi AI'}}
    }
    throw {code:'no_ai',message:'Chưa kết nối AI.'};
  }
  async function listModels(p,key){
    let r;
    try{
      if(p==='anthropic')r=await fetch('https://api.anthropic.com/v1/models?limit=100',{headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
      else if(p==='openai')r=await fetch('https://api.openai.com/v1/models',{headers:{authorization:'Bearer '+key}});
      else r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}&pageSize=200`);
    }catch(x){throw netErr()}
    if(!r.ok)throw httpErr(r.status,await errText(r));
    const j=await r.json();
    let ids;
    if(p==='anthropic')ids=(j.data||[]).map(m=>m.id);
    else if(p==='openai')ids=(j.data||[]).map(m=>m.id).filter(id=>/^(gpt|o\d|chatgpt)/i.test(id)&&!/(embed|whisper|tts|audio|image|moderation|realtime|transcribe|dall|search|instruct|codex)/i.test(id));
    else ids=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>String(m.name).replace(/^models\//,'')).filter(id=>/gemini/i.test(id));
    return [...new Set(ids)].sort();
  }
  return {PROVIDERS,cfg,setCfg,effective,mode,ask,label,listModels};
})();

const RULES_COMMON=`QUY TẮC BẮT BUỘC (áp dụng giống nhau cho mọi nhà cung cấp AI):
(1) Chỉ trả về JSON đúng schema, không thêm chữ ngoài JSON, không dùng markdown.
