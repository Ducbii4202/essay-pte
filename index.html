(3) Các điểm nằm trong "locked_scores" do ứng dụng tính bằng quy tắc cố định: PHẢI giữ nguyên đúng giá trị đó, không tự sửa.
(4) Chỉ nhận xét dựa trên dữ liệu được cung cấp, không bịa lỗi hay chi tiết không có trong dữ liệu; thiếu dữ liệu thì nói rõ "không đủ dữ liệu".
(5) Mọi giải thích bằng tiếng Việt đơn giản; câu và từ tiếng Anh giữ nguyên.
(6) Chấm nhất quán và nghiêm như giám khảo thật: không nâng điểm để khích lệ, lời khích lệ chỉ nằm ở phần nhận xét.
(7) Cùng một bài làm phải cho cùng một điểm.
`;
const formScore=n=>n>=200&&n<=300?2:(n>=120&&n<=380?1:0);
const sentencesOf=t=>(String(t).match(/[^.!?]+[.!?]+["')\]]*|[^.!?]+$/g)||[]).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=2);
const countSentences=t=>sentencesOf(t).length;
function normalizeRS(o,local){
  const adj=[],sc=o.scores||{};
  const cl=(v,mx)=>Math.max(0,Math.min(mx,Math.round(+v||0)));
  let c=cl(sc.content,3),f=cl(sc.fluency,5),p=cl(sc.pronunciation,5);
  if(c!==local.content){adj.push('Content');c=local.content}
  const bound=(v,loc,name)=>{const nv=Math.max(Math.max(0,loc-1),Math.min(Math.min(5,loc+1),v));if(nv!==v)adj.push(name);return nv};
  f=bound(f,local.fluency,'Fluency');p=bound(p,local.pron,'Pronunciation');
  o.scores={content:c,fluency:f,pronunciation:p};o.total=c+f+p;o._adj=adj;
  return o;
}
function normalizeEssay(o,ctx){
  const adj=[],cl=(v,mx)=>Math.max(0,Math.min(mx,Math.round(+v||0)));
  if(ctx.mode==='full'){
    const s=o.scores||{};
    const ns={content:cl(s.content,3),form:cl(s.form,2),dsc:cl(s.dsc,2),grammar:cl(s.grammar,2),glr:cl(s.glr,2),vocab:cl(s.vocab,2),spelling:cl(s.spelling,2)};
    if(ns.form!==ctx.form){adj.push('Form');ns.form=ctx.form}
    o.scores=ns;o.total=Object.values(ns).reduce((a,b)=>a+b,0);o.task='full';
  }else{o.task='paragraph';o.paragraph_score=cl(o.paragraph_score,10);delete o.scores;delete o.total}
  o.paragraphs=(Array.isArray(o.paragraphs)?o.paragraphs:[]).map(p=>Object.assign({},p,{sentences:(Array.isArray(p.sentences)?p.sentences:[]).map(s=>Object.assign({},s,{verdict:['ok','fix','weak'].includes(s.verdict)?s.verdict:'fix',issues:Array.isArray(s.issues)?s.issues:[]}))}));
  o.paragraphs.forEach(p=>p.sentences.forEach(s=>{if(s.verdict==='ok'&&s.issues.length){s.verdict='fix';adj.push('Nhãn câu')}}));
  const got=o.paragraphs.reduce((a,p)=>a+p.sentences.length,0);
  o._cov=ctx.sentences?Math.min(1,got/ctx.sentences):1;
  o._adj=[...new Set(adj)];
  return o;
}
function aiMeta(o){
  const bits=[];
  if(o._by)bits.push('Chấm bởi: '+o._by);
  if(o._adj&&o._adj.length)bits.push('đã chuẩn hoá theo quy tắc PTE: '+o._adj.join(', '));
  if(o._cov!=null&&o._cov<1)bits.push('AI chỉ phân tích '+Math.round(o._cov*100)+'% số câu');
  return bits.length?`<div class="note">${esc(bits.join(' · '))}</div>`:'';
}

function repairJSON(t){
  const s=t.slice(t.indexOf('{'));
  for(let cut=s.length,tries=0;cut>0&&tries<4000;cut--,tries++){
    const c=s[cut-1];if(c!=='}'&&c!==']')continue;
    const sub=s.slice(0,cut);let st=[],inS=false,es=false;
    for(const ch of sub){
      if(inS){if(es)es=false;else if(ch==='\\')es=true;else if(ch==='"')inS=false;continue}
      if(ch==='"')inS=true;else if(ch==='{'||ch==='[')st.push(ch);else if(ch==='}'||ch===']')st.pop();
    }
    if(inS)continue;
    try{return JSON.parse(sub+st.reverse().map(x=>x==='{'?'}':']').join(''))}catch(e){}
  }
  return null;
}
function parseJSON(t){
  if(!t)return null;
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0)return null;
  if(b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  return repairJSON(t);
}
function md(s){
  s=esc(s).replace(/^#{2,3} (.*)$/gm,'<h4>$1</h4>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  let out='',inl=false;
  for(const l of s.split('\n')){
    if(/^\s*[-•*] /.test(l)){if(!inl){out+='<ul>';inl=true}out+='<li>'+l.replace(/^\s*[-•*] /,'')+'</li>'}
    else{if(inl){out+='</ul>';inl=false}out+=/^<h4>/.test(l)?l:(l.trim()?'<p>'+l+'</p>':'')}
  }
  return out+(inl?'</ul>':'');
}

    const s=scoreRS(ref,heard,0.74,tm);
    const {refHit}=lcs(norm(ref),norm(heard));
    const payload={reference:ref,heard_by_recognizer:heard,missing_or_wrong_reference_words:norm(ref).filter((_,i)=>!refHit[i]),extra_words_heard:[],recognizer_confidence:0.74,timing:{delay_before_speaking_s:1.4,speaking_duration_s:4.2,pauses_over_1_4s:1,reference_word_count:norm(ref).length,seconds_per_word:0.6},local_estimate:{content:s.content,fluency:s.fluency,pronunciation:s.pron,total:s.total},locked_scores:{content:s.content}};
    const text=await AI.ask({system:RS_SYS,messages:[{role:'user',content:'Dữ liệu lần ghi âm:\n'+JSON.stringify(payload)}],maxTokens:1800,json:true,temperature:0.2});
    const o=parseJSON(text);
    add('RS: trả về JSON hợp lệ',!!o);
    if(o){
      const sc=o.scores||{};
      add('RS: điểm nằm trong thang (3 / 5 / 5)',inR(sc.content,3)&&inR(sc.fluency,5)&&inR(sc.pronunciation,5));
      add('RS: giữ đúng điểm Content do app khoá',+sc.content===s.content,`cần ${s.content}, AI ghi ${sc.content}`);
      add('RS: nhận xét bằng tiếng Việt',VI_RE.test(String(o.summary||'')));
      add('RS: chỉ ra từ bị bỏ (up / to)',/\bup\b|\bto\b/i.test(JSON.stringify(o.word_fixes||[])+String(o.content_note||'')));
      add('RS: có hướng dẫn luyện (top_tips, practice)',Array.isArray(o.top_tips)&&o.top_tips.length>0&&Array.isArray(o.practice)&&o.practice.length>0);
    }
  }catch(e){add('RS: gọi được model',false,e.message)}
  box.innerHTML='<div class="ai-load"><i></i> Đang chạy bài thử 2/2 (Essay)…</div>';
  try{
    const text1='These days, social media can be controversial.',text2='While some think that it can enhance communication, I agree have a option that it can waste our time.';
    const payload={task:'paragraph',essay_prompt:'Discuss the advantages and disadvantages of social media.',part:'Mở bài',words:wcountText(text1+' '+text2),text:text1+' '+text2,other_paragraphs_for_context:[]};
    const text=await AI.ask({system:ESSAY_GRADE_SYS,messages:[{role:'user',content:'Dữ liệu bài làm:\n'+JSON.stringify(payload)}],maxTokens:4000,json:true,temperature:0.2});
    const o=parseJSON(text);
    add('Essay: trả về JSON hợp lệ',!!o);
    if(o){
      const sents=(Array.isArray(o.paragraphs)?o.paragraphs:[]).reduce((a,p)=>a.concat(Array.isArray(p.sentences)?p.sentences:[]),[]);
      add('Essay: điểm đoạn nằm trong thang 0–10',o.paragraph_score!=null&&inR(o.paragraph_score,10));
      add('Essay: phân tích đủ cả 2 câu',sents.length>=2,`AI phân tích ${sents.length}/2 câu`);
      add('Essay: bắt được lỗi “a option”',/option/i.test(JSON.stringify(sents.map(s=>[s.issues,s.improved]))));
      add('Essay: có từ vựng hoặc mẹo nhớ',sents.some(s=>(Array.isArray(s.vocab)&&s.vocab.length)||s.memory_tip));
      add('Essay: nhận xét bằng tiếng Việt',VI_RE.test(String(o.summary||'')));
    }
  }catch(e){add('Essay: gọi được model',false,e.message)}
  const pass=rows.filter(r=>r.ok).length,pct=rows.length?pass/rows.length:0;
  const verdict=pct>=0.85?['ok','✅ Model này bám quy tắc tốt, có thể dùng để chấm bài.']:pct>=0.6?['warn','⚠️ Tạm được: model đôi khi lệch quy tắc, điểm có thể không ổn định. Nên thử model mạnh hơn.']:['bad','❌ Không khuyến nghị: model chưa bám đủ quy tắc PTE. Hãy chọn model khác.'];
  box.innerHTML=`<div class="chk ${verdict[0]}"><b>${pass}/${rows.length} mục đạt</b> · ${AI.label()}<br>${verdict[1]}</div><ul class="chklist">${rows.map(r=>`<li class="${r.ok?'ok':'bad'}">${r.ok?'✓':'✗'} ${esc(r.name)}${r.ok||!r.detail?'':`<small> — ${esc(r.detail)}</small>`}</li>`).join('')}</ul><div class="note">Mỗi lần chạy có thể cho kết quả hơi khác nhau. Luật khoá điểm và chuẩn hoá của app vẫn áp dụng khi chấm thật.</div>`;
}

/* ============ AI: REPEAT SENTENCE FEEDBACK ============ */
const RS_SYS=RULES_COMMON+`Bạn là giám khảo và huấn luyện viên PTE Academic, phần Repeat Sentence, cho học viên Việt Nam (trình độ khoảng A2–B1).
QUAN TRỌNG: bạn KHÔNG nghe được âm thanh. Bạn chỉ có: câu mẫu, chữ mà máy nhận dạng giọng nói nghe được, độ tin cậy nhận dạng (0 = không có), số liệu thời gian (độ trễ trước khi nói, thời lượng nói, số lần ngập ngừng, tốc độ) và điểm ước lượng cục bộ. Hãy SUY LUẬN lỗi phát âm từ chênh lệch giữa câu mẫu và chữ nghe được (từ bị bỏ, bị thay bằng từ khác, bị thêm), độ tin cậy thấp và ngập ngừng. Không bịa chi tiết âm thanh mà bạn không thể biết; dùng từ "có thể" khi suy đoán.
Thang PTE: Content 0–3 (3 = đủ từ đúng thứ tự; 2 = ít nhất 50% từ đúng; 1 = dưới 50%; 0 = gần như không có). Oral Fluency 0–5 (nhịp tự nhiên, ngắt nghỉ đúng chỗ, không ngập ngừng/lặp/tự sửa, tốc độ ổn định). Pronunciation 0–5 (nguyên âm/phụ âm, trọng âm từ và câu, ngữ điệu, dễ hiểu với người bản xứ). Tổng tối đa 13.
Khi hướng dẫn sửa, ưu tiên lỗi người Việt hay mắc: rụng phụ âm cuối (-s, -ed, -t, -d, -k), nhầm /θ/ /ð/, nhầm /ʃ/ /s/, thiếu trọng âm, đọc đều từng âm tiết, không nối âm, thiếu các từ chức năng nhỏ (a, the, of, to).
Chỉ trả về MỘT đối tượng JSON hợp lệ, không có markdown, không có chữ nào ngoài JSON, tất cả giá trị văn bản bằng tiếng Việt đơn giản (từ tiếng Anh giữ nguyên), đúng schema:
{"scores":{"content":0,"fluency":0,"pronunciation":0},"total":0,"summary":"2-3 câu nhận xét tổng quan, thân thiện","content_note":"...","fluency_note":"...","pronunciation_note":"...","word_fixes":[{"word":"từ trong câu mẫu","heard":"từ máy nghe được hoặc rỗng nếu bị bỏ","problem":"lỗi có thể gặp","how":"cách sửa cụ thể: phiên âm IPA + cách đặt lưỡi/môi/hơi bằng tiếng Việt","drill":"một cụm hoặc câu ngắn để luyện"}],"top_tips":["3 việc quan trọng nhất để tăng điểm"],"practice":["3 bước luyện tập cụ thể ngay bây giờ"],"to_next_level":"cần làm gì để tăng thêm 1-2 điểm"}
Nếu có locked_scores.content thì scores.content phải bằng đúng giá trị đó. word_fixes tối đa 5 mục, chỉ chọn từ thực sự có vấn đề; nếu không có lỗi thì để mảng rỗng.`;

function aiCardHTML(o){
  const sc=o.scores||{};
  const n=(v,m)=>Math.max(0,Math.min(m,Math.round(+v||0)));
  const c=n(sc.content,3),f=n(sc.fluency,5),p=n(sc.pronunciation,5);
  const tot=c+f+p;
  const arr=x=>Array.isArray(x)?x.filter(Boolean):[];
  const wf=arr(o.word_fixes).slice(0,5).map(w=>`<div class="wf"><span class="w">${esc(w.word||'')}</span> ${w.heard?`<small>máy nghe: “${esc(w.heard)}”</small>`:'<small>bị bỏ sót hoặc không rõ</small>'}<div>${esc(w.problem||'')}</div><div class="how">🛠 ${esc(w.how||'')}</div>${w.drill?`<div class="dr">🔁 Luyện: ${esc(w.drill)}</div>`:''}</div>`).join('');
  return `<div class="aicard"><div class="ai-h">🤖 Nhận xét của AI</div>
   <div class="ai-scores"><span class="ai-total">${tot}/13</span><span class="chip ${gradeCls(c/3)}">Content ${c}/3</span><span class="chip ${gradeCls(f/5)}">Fluency ${f}/5</span><span class="chip ${gradeCls(p/5)}">Pronunciation ${p}/5</span></div>
   <div class="ai-sum">${esc(o.summary||'')}</div>
   ${o.content_note?`<div class="ai-note"><b>📝 Content</b>${esc(o.content_note)}</div>`:''}
   ${o.fluency_note?`<div class="ai-note"><b>🗣 Oral Fluency</b>${esc(o.fluency_note)}</div>`:''}
   ${o.pronunciation_note?`<div class="ai-note"><b>🔊 Pronunciation</b>${esc(o.pronunciation_note)}</div>`:''}
   ${wf?`<div class="sec">Từ cần sửa phát âm</div>${wf}`:''}
   ${arr(o.top_tips).length?`<div class="sec">3 việc quan trọng nhất</div><ol>${arr(o.top_tips).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
   ${arr(o.practice).length?`<div class="sec">Luyện ngay</div><ol>${arr(o.practice).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
   ${o.to_next_level?`<div class="aigoal">🎯 <b>Để cao điểm hơn:</b> ${esc(o.to_next_level)}</div>`:''}
   <div class="note">AI không nghe được âm thanh. Nhận xét dựa trên chữ máy nhận dạng, độ tin cậy và thời gian nói, nên có thể chưa chính xác 100%.</div>${aiMeta(o)}</div>`;
}
async function rsAIFeedback(box,it,s,res,entryId){
  const m=await AI.mode();
  if(!document.body.contains(box))return;
  if(!m){
    box.innerHTML=`<div class="aicard"><div class="ai-h">🤖 Nhận xét của AI</div><p class="note">Kết nối AI để nhận nhận xét chi tiết và hướng dẫn sửa phát âm cho từng lần ghi âm.</p><button class="btn sm pri" data-a="aiset">Kết nối AI</button></div>`;
    box.querySelector('[data-a=aiset]').onclick=openAISettings;return;
  }
  box.innerHTML='<div class="aicard"><div class="ai-h">🤖 Nhận xét của AI</div><div class="ai-load"><i></i> AI đang chấm và soạn hướng dẫn… (khoảng 5–25 giây)</div></div>';
  const {refHit,hypHit}=lcs(norm(it.en),norm(res.text));
  const hypW=norm(res.text);
  const dur=Math.max(0.1,(res.tm.last-res.tm.first)/1000);
  const payload={
    reference:it.en,heard_by_recognizer:res.text,
    missing_or_wrong_reference_words:norm(it.en).filter((_,i)=>!refHit[i]),
    extra_words_heard:hypW.filter((_,i)=>!hypHit[i]),
    recognizer_confidence:+(res.conf||0).toFixed(2),
    timing:{delay_before_speaking_s:+res.tm.delay.toFixed(1),speaking_duration_s:+dur.toFixed(1),pauses_over_1_4s:res.tm.pauses,reference_word_count:norm(it.en).length,seconds_per_word:+(dur/Math.max(1,hypW.length)).toFixed(2)},
    local_estimate:{content:s.content,fluency:s.fluency,pronunciation:s.pron,total:s.total},
    locked_scores:{content:s.content}
  };
  try{
    const text=await AI.ask({system:RS_SYS,messages:[{role:'user',content:'Dữ liệu lần ghi âm:\n'+JSON.stringify(payload)}],maxTokens:1800,json:true,temperature:0.2});
    if(!document.body.contains(box))return;
    const obj=parseJSON(text);
    if(!obj)throw {message:'AI trả về định dạng không đọc được. Hãy bấm thử lại.'};
    normalizeRS(obj,{content:s.content,fluency:s.fluency,pron:s.pron});obj._by=AI.label();
    box.innerHTML=aiCardHTML(obj);
    const h=hist.find(x=>x.id===entryId);if(h){h.ai=obj;store.set('pte_hist_rs',hist)}
  }catch(e){
    if(!document.body.contains(box))return;
    box.innerHTML=aiErrHTML(e);
    const r=box.querySelector('[data-a=airetry]');if(r)r.onclick=()=>rsAIFeedback(box,it,s,res,entryId);
    const g=box.querySelector('[data-a=aiset]');if(g)g.onclick=openAISettings;
  }
}

/* ============ AI: ESSAY CHAT (per step) ============ */
const ESSAY_SYS=`Bạn là thầy/cô dạy viết Essay PTE Academic (Write Essay) cho học sinh lớp 8 người Việt, đang học theo template "lợi – hại": Mở bài (2 câu: "These days, X can be controversial. While some think that [lợi], I agree with those who feel that [hại].") → Thân bài 1 LỢI và Thân bài 2 HẠI, mỗi thân bài 4 câu theo thứ tự Ý – Vì – Ví – Vậy → Kết bài 1 câu ("In conclusion, although ..., the harms/benefits of X are far more significant."). Mẫu Ý lợi: can play a vital role in / can enhance; Ý hại: can wreak havoc on / can take a massive toll on / can negatively affect; Vì: ", which can ..., thereby/hence V-ing"; Ví: "In Vietnam/In Australia, many ..."; Vậy lợi: câu điều kiện loại 1 (If + hiện tại đơn, will); Vậy hại: câu điều kiện loại 2 (If ... were to ..., would).
Trả lời bằng TIẾNG VIỆT đơn giản, ngắn gọn, thân thiện, khích lệ (học sinh lớp 8). Câu tiếng Anh giữ nguyên nhưng giải thích bằng tiếng Việt. Dùng Markdown đơn giản: **đậm**, gạch đầu dòng "- ", tiêu đề "### ". Không dùng bảng.
Có 3 kiểu yêu cầu:
1) HỎI ĐÁP: giải thích bước đang học, cho ví dụ thêm, giải đáp thắc mắc. Chỉ dựa trên ngữ cảnh bước và template.
2) CHẤM BƯỚC (tin nhắn bắt đầu bằng [CHẤM BƯỚC]): chấm phần học sinh viết cho bước này. Trả lời theo đúng thứ tự: "### Điểm bước này: X/10" (tiêu chí: đúng mẫu câu template, ngữ pháp, từ vựng, ý hợp lý); "### Lỗi cần sửa" (mỗi lỗi: trích đoạn sai → bản sửa → vì sao, ngắn gọn); "### Bản viết tốt hơn" (viết lại phần của học sinh, giữ ý của em); "### Lưu ý để tiến bộ" (1–3 điều cụ thể, nhắc lỗi thường gặp).
3) CHẤM CẢ BÀI (tin nhắn bắt đầu bằng [CHẤM CẢ BÀI]): chấm theo tiêu chí PTE Write Essay: Content 0–3, Form 0–2 (200–300 từ = 2; 120–199 hoặc 301–380 từ = 1; ngoài khoảng đó = 0; dùng số từ được cung cấp), Development/Structure/Coherence 0–2, Grammar 0–2, General Linguistic Range 0–2, Vocabulary Range 0–2, Spelling 0–2; tổng /15. Trình bày: "### Điểm: X/15" kèm điểm từng tiêu chí (mỗi tiêu chí một dòng, có lý do ngắn); "### Lỗi cần sửa" (tối đa 6 lỗi nặng nhất, dạng trích đoạn → sửa → vì sao); "### Cách để cao điểm hơn" (2–4 việc cụ thể); "### Lưu ý" (ví dụ: mở bài và kết bài phải cùng một phe, đủ Ý–Vì–Ví–Vậy ở mỗi thân bài, đủ số từ, tránh lặp từ, kiểm tra câu điều kiện). Không viết lại cả bài thay học sinh, chỉ sửa mẫu từng chỗ.
Nếu học sinh chưa viết gì mà bấm chấm, nhắc nhẹ nhàng cần gõ bài làm trước.`;

const chats=store.get('pte_chat',{});
const drafts=store.get('pte_drafts',{});
let chatMode={};
const wcountText=s=>(s.trim().match(/\S+/g)||[]).length;
function saveChats(){const o={};Object.keys(chats).forEach(k=>{o[k]=chats[k].slice(-14)});store.set('pte_chat',o)}
function compileEssay(){
  const pick=(full,parts)=>drafts[full]||parts.map(k=>drafts[k]).filter(Boolean).join(' ');
  return [pick(7,[5,6]),pick(14,[9,10,11,12]),pick(20,[15,16,17,18]),pick(21,[])].filter(Boolean).join('\n\n');
}
function mountChat(step,html){
  const main=$('#main');

  const ctx=tmp.textContent.replace(/\s+/g,' ').trim().slice(0,2500);
  const mode0=chatMode[step]||'ask';
  main.insertAdjacentHTML('beforeend',`<section class="chat" aria-label="Trợ lý AI cho bước này">
    <div class="chat-h"><span>🤖 Hỏi AI · Bước ${step+1}</span><button class="link" data-a="aiset" style="min-height:36px">⚙ Cài đặt AI</button></div>
    <div class="chat-msgs" role="log" aria-live="polite" data-a="msgs"></div>
    <div class="chat-modes" role="group" aria-label="Kiểu hỏi">
      <button data-mode="ask">💬 Hỏi đáp</button><button data-mode="step">✅ Chấm bước này</button><button data-mode="essay">📝 Chấm cả bài</button>
    </div>
    <div class="chat-quick" data-a="quick"></div>
    <textarea class="chat-in" data-a="in" rows="3"></textarea>
    <div class="chat-row"><button class="btn" data-a="fill" hidden>📥 Lấy các bước đã viết</button><button class="btn pri" data-a="send">Gửi</button></div>
    <div class="hintline" data-a="hint"></div>
  </section>`);
  const box=main.querySelector('.chat');
  const q=a=>box.querySelector(`[data-a=${a}]`);
  const msgs=q('msgs'),inp=q('in');
  const list=()=>chats[step]||(chats[step]=[]);
  function drawMsgs(){
    msgs.innerHTML=list().length?list().map(m=>m.role==='user'?`<div class="msg u">${esc(m.content)}</div>`:`<div class="msg a${m.err?' err':''}">${m.err?esc(m.content):md(m.content)}</div>`).join(''):'<div class="msg a"><p>Chào em! 👋 Em có thể hỏi về bước này, hoặc gõ bài em viết rồi bấm <b>Chấm bước này</b> / <b>Chấm cả bài</b> để được chấm và hướng dẫn sửa.</p></div>';
    msgs.scrollTop=msgs.scrollHeight;
  }
  const QUICK={
    ask:['Giải thích bước này đơn giản hơn','Cho thêm một ví dụ khác','Em hay sai lỗi gì ở bước này?','Cách nhớ bước này?'],
    step:['Em viết ví dụ với chủ đề social media:','Em viết với chủ đề online learning:'],
    essay:[]
  };
  function setMode(m){
    chatMode[step]=m;
    box.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
    inp.placeholder=m==='ask'?'Hỏi AI về bước này…':m==='step'?'Gõ câu/đoạn em viết cho bước này để AI chấm…':'Dán hoặc gõ cả bài essay (có thể bấm “Lấy các bước đã viết”)…';
    inp.rows=m==='essay'?9:3;

  }
  setMode(mode0);drawMsgs();
  box.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

const PART_HINT=['Mở bài (2 câu): These days, … can be controversial. While some think that …, I agree with those who feel that …','Thân bài 1 – LỢI (4 câu: Ý – Vì – Ví – Vậy): To commence with, …','Thân bài 2 – HẠI (4 câu: Ý – Vì – Ví – Vậy): On the contrary, critics argue that …','Kết bài (1 câu): In conclusion, although …, … are far more significant.'];

if(!['lesson','practice','book','files'].includes(esMode))esMode='lesson';
let essSel=store.get('pte_ess_sel','all');

let mistakes=store.get('pte_mistakes',[]);

const pkey=p=>p.sid+':'+p.n;

function essPool(){
  const act=setsOf('essay');
  const sets=essSel==='all'?act:act.filter(s=>s.id===essSel);
  const out=[];
  sets.forEach(s=>s.items.forEach(it=>out.push({sid:s.id,sname:s.name,n:it.n,en:it.en,vi:it.vi||''})));
  return out;
}
function essPick(force){
  const pool=essPool();
  if(!pool.length){essCur=null;return null}
  if(!force&&essCur&&pool.some(p=>pkey(p)===pkey(essCur)))return essCur;
  essBag=essBag.filter(k=>pool.some(p=>pkey(p)===k));
  if(!essBag.length){
    essBag=pool.map(pkey).sort(()=>Math.random()-.5);
    if(essCur&&essBag.length>1&&essBag[essBag.length-1]===pkey(essCur))essBag.unshift(essBag.pop());
  }
  const k=essBag.pop();
  essCur=pool.find(p=>pkey(p)===k);
  store.set('pte_ess_cur',essCur);
  essDraft={key:pkey(essCur),p:['','','','']};store.set('pte_ess_draft',essDraft);
  return essCur;
}

/* ----- AI grading ----- */
const ESSAY_GRADE_SYS=RULES_COMMON+`Bạn là giám khảo PTE Academic (Write Essay) kiêm thầy/cô dạy viết cho học sinh lớp 8 người Việt, đang học theo template "lợi – hại": Mở bài 2 câu; Thân bài 1 (LỢI) và Thân bài 2 (HẠI) mỗi đoạn 4 câu theo thứ tự Ý – Vì – Ví – Vậy; Kết bài 1 câu. Mẫu: Ý lợi "can play a vital role in / can enhance"; Ý hại "can wreak havoc on / take a massive toll on / negatively affect"; Vì ", which can …, thereby/hence V-ing"; Ví "In Vietnam/In Australia, many …"; Vậy lợi: câu điều kiện loại 1 (If + hiện tại đơn, will); Vậy hại: loại 2 (If … were to …, would). Ghi nhận khi học sinh dùng đúng mẫu, nhưng giúp em nâng cấp từ vựng và cách diễn đạt phong phú hơn để tăng điểm.
Thang PTE Write Essay (tổng 15): content 0–3; form 0–2 (200–300 từ = 2; 120–199 hoặc 301–380 từ = 1; còn lại 0, dùng số từ được cung cấp); dsc (Development, Structure, Coherence) 0–2; grammar 0–2; glr (General Linguistic Range) 0–2; vocab (Vocabulary Range) 0–2; spelling 0–2.
Chỉ trả về MỘT đối tượng JSON hợp lệ, không markdown, không văn bản ngoài JSON. Mọi lời giải thích bằng tiếng Việt đơn giản; câu và từ tiếng Anh giữ nguyên.
{"task":"full" hoặc "paragraph",
"scores":{"content":0,"form":0,"dsc":0,"grammar":0,"glr":0,"vocab":0,"spelling":0},
"total":0,
"paragraph_score":0,
"score_reasons":{"content":"…","form":"…","dsc":"…","grammar":"…","glr":"…","vocab":"…","spelling":"…"},
"summary":"2-3 câu tổng quan, khích lệ",
"paragraphs":[{"part":"Mở bài | Thân bài 1 (Lợi) | Thân bài 2 (Hại) | Kết bài","note":"nhận xét đoạn","sentences":[{"original":"câu học sinh viết","verdict":"ok | fix | weak","issues":["trích đoạn sai → bản sửa → vì sao"],"improved":"câu tốt hơn, giữ ý của học sinh","develop":"cách phát triển ý ở câu này (thêm lý do/ví dụ/kết quả) kèm một câu mẫu tiếng Anh ngắn","vocab":[{"word":"từ/cụm đáng học","meaning":"nghĩa tiếng Việt","example":"ví dụ ngắn"}],"memory_tip":"mẹo nhớ ngắn để lần sau không sai lại"}]}],
"top_mistakes":[{"mistake":"lỗi nặng nhất hoặc hay lặp lại","fix":"cách sửa","why":"vì sao mất điểm"}],
"vocab_bank":[{"word":"…","meaning":"…","example":"…"}],
"next_steps":["…"],
"remember":["3-5 câu ghi nhớ ngắn, dễ thuộc"]}
Quy tắc: nếu có locked_scores.form thì scores.form phải bằng đúng giá trị đó. task "full" thì điền scores, total (tổng 7 điểm), score_reasons (mỗi mục một câu) và bỏ paragraph_score; task "paragraph" thì chỉ điền paragraph_score (0–10) và bỏ scores, total, score_reasons. MỌI câu của học sinh đều phải xuất hiện trong "sentences" đúng thứ tự, không bỏ câu. verdict "ok" thì issues để rỗng. "vocab" mỗi câu 0–2 mục. "vocab_bank" 6–10 từ/cụm theo CHỦ ĐỀ của đề bài (kèm nghĩa và ví dụ), ưu tiên từ dùng lại được cho nhiều đề. top_mistakes tối đa 5. next_steps tối đa 4. Không viết lại cả bài thay học sinh. Mỗi trường tối đa 2 câu để JSON không bị cắt.`;

async function essGrade(body,mode,idx){
  const cur=essCur,out=body.querySelector('[data-a=out]');
  const paras=essDraft.p.map(s=>s.trim());
  const words=paras.map(wcountText);
  const total=words.reduce((a,b)=>a+b,0);
  if(mode==='full'&&total<15){out.innerHTML='<div class="warnbox">Em hãy viết ít nhất vài câu trước khi chấm cả bài nhé.</div>';return}
  if(mode==='part'&&words[idx]<3){out.innerHTML=`<div class="warnbox">Ô “${PARTS[idx]}” đang trống hoặc quá ngắn. Hãy gõ đoạn này trước khi chấm.</div>`;return}
  const m=await AI.mode();
  if(!m){
    out.innerHTML=aiErrHTML({code:'no_ai',message:'Chưa kết nối AI. Kết nối để được chấm bài và nhận hướng dẫn sửa.'});
    out.querySelector('[data-a=aiset]').onclick=openAISettings;return;
  }
  out.innerHTML=`<div class="aicard"><div class="ai-h">🤖 AI đang chấm ${mode==='full'?'cả bài':'đoạn '+PARTS[idx]}</div><div class="ai-load"><i></i> Khoảng 15–60 giây, em chờ một chút nhé…</div></div>`;
  out.scrollIntoView&&out.scrollIntoView({behavior:'smooth',block:'start'});
  const payload=mode==='full'
    ?{task:'full',essay_prompt:cur.en,total_words:total,locked_scores:{form:formScore(total)},words_per_paragraph:PARTS.map((p,i)=>({part:p,words:words[i]})),paragraphs:PARTS.map((p,i)=>({part:p,text:paras[i]})).filter(x=>x.text)}
    :{task:'paragraph',essay_prompt:cur.en,part:PARTS[idx],words:words[idx],text:paras[idx],other_paragraphs_for_context:PARTS.map((p,i)=>({part:p,text:paras[i]})).filter((x,i)=>i!==idx&&x.text)};
  const run=async()=>{
    try{
      const ctx={mode,form:formScore(total),sentences:countSentences(mode==='full'?paras.join(' '):paras[idx])};
      let obj=null;
      for(let attempt=0;attempt<2;attempt++){
        const pl=attempt?Object.assign({},payload,{luu_y_quan_trong:`Lần trước bạn bỏ sót câu. Hãy phân tích ĐẦY ĐỦ tất cả ${ctx.sentences} câu của học sinh, đúng thứ tự, không bỏ câu nào.`}):payload;
        const text=await AI.ask({system:ESSAY_GRADE_SYS,messages:[{role:'user',content:'Dữ liệu bài làm:\n'+JSON.stringify(pl)}],maxTokens:mode==='full'?7000:4000,json:true,temperature:0.2});
        if(!document.body.contains(out))return;
        const o=parseJSON(text);
        if(!o){if(attempt&&!obj)throw {message:'AI trả về định dạng không đọc được. Hãy bấm thử lại.'};continue}
        normalizeEssay(o,ctx);
        if(!obj||o._cov>=obj._cov)obj=o;
        if(obj._cov>=0.85)break;
      }
      if(!obj)throw {message:'AI trả về định dạng không đọc được. Hãy bấm thử lại.'};
      obj._by=AI.label();
      const entry={id:Date.now(),sid:cur.sid,sname:cur.sname,n:cur.n,prompt:cur.en,vi:cur.vi,paras,mode,part:idx,words:mode==='full'?total:words[idx],ai:obj};
      essHist.unshift(entry);essHist=essHist.slice(0,60);store.set('pte_ess_hist',essHist);
      const saved=saveNotebook(obj,cur);
      out.innerHTML=essayFeedbackHTML(obj,saved)+`<div class="btns" style="margin-top:12px"><button class="btn pri" data-a="next">🎲 Đề tiếp theo (random)</button><button class="btn" data-a="redo">🔁 Chấm lại</button></div>`;
      out.querySelector('[data-a=next]').onclick=()=>{essPick(true);esPractice(body);body.scrollTop=0};
      out.querySelector('[data-a=redo]').onclick=()=>essGrade(body,mode,idx);
    }catch(e){
      if(!document.body.contains(out))return;
      out.innerHTML=aiErrHTML(e);
      const r=out.querySelector('[data-a=airetry]');if(r)r.onclick=()=>essGrade(body,mode,idx);
      const g=out.querySelector('[data-a=aiset]');if(g)g.onclick=openAISettings;
    }
  };
  run();
}
function saveNotebook(o,cur){
  let nv=0,nm=0;
  const addV=v=>{
    if(!v||!v.word||!v.meaning)return;
    const k=String(v.word).trim().toLowerCase();if(!k)return;
    if(vocab[k]){vocab[k].count=(vocab[k].count||1)+1;vocab[k].last=Date.now();if(v.example&&!vocab[k].example)vocab[k].example=v.example}
    else{vocab[k]={word:String(v.word).trim(),meaning:String(v.meaning),example:String(v.example||''),count:1,first:Date.now(),last:Date.now(),topic:cur?cur.en.slice(0,60):''};nv++}
  };
  (Array.isArray(o.vocab_bank)?o.vocab_bank:[]).forEach(addV);
  (Array.isArray(o.paragraphs)?o.paragraphs:[]).forEach(p=>(Array.isArray(p.sentences)?p.sentences:[]).forEach(s=>(Array.isArray(s.vocab)?s.vocab:[]).forEach(addV)));
  (Array.isArray(o.top_mistakes)?o.top_mistakes:[]).forEach(x=>{
    if(!x||!x.mistake)return;
    const k=String(x.mistake).trim().toLowerCase();
    const ex=mistakes.find(y=>y.mistake.trim().toLowerCase()===k);
    if(ex){ex.count=(ex.count||1)+1;ex.last=Date.now()}
    else{mistakes.unshift({id:Date.now()+Math.random(),mistake:String(x.mistake),fix:String(x.fix||''),why:String(x.why||''),count:1,last:Date.now()});nm++}
  });
  mistakes=mistakes.slice(0,200);
  store.set('pte_vocab',vocab);store.set('pte_mistakes',mistakes);
  return {nv,nm};
}
function essayFeedbackHTML(o,saved){
  const arr=x=>Array.isArray(x)?x.filter(Boolean):[];
  const full=o.task!=='paragraph'&&o.scores;
  const nn=(v,mx)=>Math.max(0,Math.min(mx,Math.round(+v||0)));
  let head='';
  if(full){
    const sc=o.scores,CR=[['content','Content',3],['form','Form',2],['dsc','Development, Structure, Coherence',2],['grammar','Grammar',2],['glr','General Linguistic Range',2],['vocab','Vocabulary Range',2],['spelling','Spelling',2]];
    const vals=CR.map(([k,l,mx])=>[l,nn(sc[k],mx),mx,(o.score_reasons||{})[CR.find(c=>c[0]===k)[0]]]);
    const tot=vals.reduce((a,v)=>a+v[1],0);

function bookHist(bk,body){
  if(!essHist.length){bk.innerHTML='<div class="empty"><b>Chưa có bài nào</b>Hãy làm một đề ở tab “✍️ Làm đề” và bấm chấm.</div>';return}
  const fulls=essHist.filter(h=>h.mode==='full'&&h.ai&&h.ai.scores);
  const tot=h=>Object.values(h.ai.scores).reduce((a,v)=>a+(+v||0),0);
  const avg=fulls.length?fulls.slice(0,10).reduce((a,h)=>a+tot(h),0)/Math.min(10,fulls.length):null;
  bk.innerHTML=`<div class="stats"><div class="stat"><b>${essHist.length}</b><small>Lần chấm</small></div><div class="stat"><b>${avg===null?'–':avg.toFixed(1)}<small style="font:600 13px 'Be Vietnam Pro'"> /15</small></b><small>Trung bình cả bài (10 lần gần nhất)</small></div></div>
  <div class="hl">${essHist.map((h,i)=>{
    const isFull=h.mode==='full'&&h.ai&&h.ai.scores;
    const sc=isFull?tot(h):(h.ai&&h.ai.paragraph_score!=null?+h.ai.paragraph_score:null);
    const mx=isFull?15:10;
    const c=sc===null?'warn':gradeCls(sc/mx);
    return `<details class="h" data-i="${i}"><summary><span class="sc-chip ${c}">${sc===null?'–':sc}<small>/${mx}</small></span><span class="h-main"><b>${isFull?'Cả bài':esc(PARTS[h.part]||'Đoạn')}</b> · ${esc(h.sname)}<span class="h-sub">${fmtDate(h.id)} · ${h.words} từ · ${esc((h.prompt||'').slice(0,70))}…</span></span><span class="chev">›</span></summary>
     <div class="h-body"><div class="sec">Đề bài</div><div>${esc(h.prompt)}</div>${h.vi?`<div class="vi">${esc(h.vi)}</div>`:''}
     <div class="sec">Bài đã viết</div>${(h.paras||[]).map((p,k)=>p?`<p><b>${PARTS[k]}:</b> ${esc(p)}</p>`:'').join('')}
     ${essayFeedbackHTML(h.ai||{},null)}
     <div class="btns" style="margin-top:10px"><button class="btn sm pri" data-a="again" data-i="${i}">✍️ Làm lại đề này</button><button class="btn sm" data-a="del" data-i="${i}">🗑 Xoá</button></div></div></details>`;
  }).join('')}</div>`;

    essCur={sid:h.sid,sname:h.sname,n:h.n,en:h.prompt,vi:h.vi||''};store.set('pte_ess_cur',essCur);
    essDraft={key:pkey(essCur),p:(h.paras||['','','','']).slice(0,4)};while(essDraft.p.length<4)essDraft.p.push('');store.set('pte_ess_draft',essDraft);
    esMode='practice';store.set('es_mode',esMode);renderES();
  };

function bookVocab(bk,body){
  const keys=Object.keys(vocab).sort((a,b)=>(vocab[b].last||0)-(vocab[a].last||0));
  if(!keys.length){bk.innerHTML='<div class="empty"><b>Sổ từ vựng đang trống</b>Từ vựng AI gợi ý sau mỗi lần chấm sẽ được lưu ở đây.</div>';return}
  let q='';
  bk.innerHTML=`<div class="btns"><button class="btn pri" data-a="rev">🧠 Ôn nhanh</button><button class="btn" data-a="clr">🗑 Xoá hết</button></div>

    const t=q.trim().toLowerCase();
    bk.querySelector('[data-a=vl]').innerHTML=keys.filter(k=>vocab[k]&&(!t||k.includes(t)||vocab[k].meaning.toLowerCase().includes(t))).map(k=>{const v=vocab[k];return `<div class="vcard"><div class="vtop"><b>${esc(v.word)}</b><button class="x2" data-k="${esc(k)}" aria-label="Xoá từ ${esc(v.word)}">✕</button></div><span>${esc(v.meaning)}</span>${v.example?`<small>${esc(v.example)}</small>`:''}<small class="muted">Gặp ${v.count||1} lần${v.topic?' · '+esc(v.topic)+'…':''}</small></div>`}).join('')||'<div class="empty">Không có kết quả.</div>';
  };

  bk.querySelector('input').oninput=e=>{q=e.target.value;draw()};
  bk.querySelector('[data-a=vl]').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;delete vocab[b.dataset.k];store.set('pte_vocab',vocab);esBook(body)};
  bk.querySelector('[data-a=clr]').onclick=()=>{if(confirm('Xoá toàn bộ từ vựng đã lưu?')){vocab={};store.set('pte_vocab',vocab);esBook(body)}};
  bk.querySelector('[data-a=rev]').onclick=()=>vocabReview(bk,body);
}
function vocabReview(bk,body){
  let queue=Object.keys(vocab).sort(()=>Math.random()-.5),shown=false,known=0,total=queue.length;
  const draw=()=>{
    if(!queue.length){bk.innerHTML=`<div class="empty"><b>Xong rồi! 🎉</b>Em đã ôn ${total} từ, nhớ ngay ${known} từ.<div style="margin-top:12px"><button class="btn pri" data-a="back">Quay lại sổ tay</button></div></div>`;bk.querySelector('[data-a=back]').onclick=()=>esBook(body);return}
    const v=vocab[queue[0]];
    bk.innerHTML=`<div class="note">Còn ${queue.length}/${total} từ</div><div class="sent-card" style="text-align:center;cursor:pointer" data-a="card" role="button" tabindex="0"><div class="prompt">${esc(v.word)}</div>${shown?`<div style="margin-top:8px;font-weight:600">${esc(v.meaning)}</div>${v.example?`<div class="vi" style="margin-top:6px">${esc(v.example)}</div>`:''}`:'<div class="vi" style="margin-top:8px">Chạm để xem nghĩa</div>'}</div>
     <div class="btns"><button class="btn" data-a="no"${shown?'':' disabled'}>Chưa nhớ</button><button class="btn pri" data-a="yes"${shown?'':' disabled'}>Nhớ rồi ✓</button></div><button class="btn sm" data-a="back" style="width:100%">Thoát</button>`;
    const card=bk.querySelector('[data-a=card]');
    card.onclick=()=>{shown=true;draw()};card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();shown=true;draw()}};
    bk.querySelector('[data-a=back]').onclick=()=>esBook(body);
    bk.querySelector('[data-a=yes]').onclick=()=>{queue.shift();known++;shown=false;draw()};
    bk.querySelector('[data-a=no]').onclick=()=>{queue.push(queue.shift());shown=false;draw()};
  };
  draw();
}
function bookMist(bk,body){
  if(!mistakes.length){bk.innerHTML='<div class="empty"><b>Chưa có lỗi nào</b>Các lỗi quan trọng AI chỉ ra sẽ được lưu để em ôn lại.</div>';return}

}

const wcount=s=>s.trim().split(/\s+/).length;
const gradeCls=r=>r>=0.77?'ok':r>=0.54?'warn':'bad';
const stateOf=(kind,n)=>{const sc=getScore(kind,n);return !sc?'new':(sc.v/sc.m>=0.75?'good':'review')};
function markWords(ref,hyp){
  const r=norm(ref),h=norm(hyp);
  const {refHit}=lcs(r,h);
  let k=0;
  return ref.split(/\s+/).map(w=>{
    const t=norm(w);
    if(!t.length)return esc(w);
    const hit=t.every((_,i)=>refHit[k+i]);k+=t.length;
    return `<span class="${hit?'w-ok':'w-miss'}">${esc(w)}</span>`;
  }).join(' ');
}

    ${SR?'':'<div class="warnbox">Trình duyệt này chưa hỗ trợ nhận dạng giọng nói nên chưa chấm điểm được. Hãy mở bằng <b>Chrome</b> hoặc <b>Safari</b> mới. Bạn vẫn ghi âm và nghe lại được.</div>'}
    <div data-a="result"></div>
    <div class="navrow"><button data-a="prev">← Trước</button><button data-a="rand">🎲 Ngẫu nhiên</button><button data-a="next">Sau →</button></div>

  </div>`;
  const stage=body.querySelector('.stage');
  const q=a=>body.querySelector(`[data-a=${a}]`);
  const setStatus=(t,cls)=>{const s=q('status');s.textContent=t;s.className='status'+(cls?' '+cls:'')};
  const pst=q('pst'),plab=q('plab'),psec=q('psec'),pbar=q('pbar'),phint=q('phint');
  function pteShow(cls,label,hint){pst.hidden=false;pst.className='pte-st '+cls;plab.textContent=label;phint.textContent=hint||''}
  function ptePlay(){
    clearInterval(pTimer);
    const est=Math.max(1.5,wcount(it.en)*0.42/(tts.rate||1)),s0=performance.now();
    pteShow('play','Trạng thái: Đang phát câu mẫu','Nghe kỹ, chỉ nghe một lần.');
    psec.textContent='🔊';pbar.style.width='0%';
    pTimer=setInterval(()=>{pbar.style.width=Math.min(95,(performance.now()-s0)/1000/est*100)+'%'},100);
  }
  function pteEndPlay(next){clearInterval(pTimer);pTimer=null;pbar.style.width='100%';plab.textContent=next?'Trạng thái: Phát xong, chuẩn bị ghi âm…':'Trạng thái: Đã phát xong';psec.textContent='✓';phint.textContent=next?'':'Bấm nút micro để ghi âm và nói lại.'}
  function pteRec(limit,silence,auto){
    clearInterval(pTimer);
    const s0=performance.now();
    pteShow('rec','Trạng thái: Đang ghi âm',auto?`Tự dừng sau ${silence} giây im lặng hoặc khi hết ${limit} giây.`:'Bấm “Dừng” khi nói xong.');
    const tick=()=>{const e=(performance.now()-s0)/1000;psec.innerHTML=`${Math.floor(e)}<small> / ${limit} giây</small>`;pbar.style.width=Math.min(100,e/limit*100)+'%';pst.classList.toggle('low',limit-e<=3)};
    tick();pTimer=setInterval(tick,100);
  }
  function pteDone(sec){clearInterval(pTimer);pTimer=null;pteShow('done','Trạng thái: Hoàn thành','');psec.innerHTML=`${Math.floor(sec)}<small> giây</small>`;pbar.style.width='100%'}
  const redo=()=>{stopAll();rsPractice(body)};
  body.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{rsExam=b.dataset.mode==='exam';store.set('rs_exam',rsExam);redo()});
  q('te').onclick=q('en').onclick=()=>{if(canBlur)return;rsShowEn=!rsShowEn;q('en').classList.toggle('blur',!rsShowEn)};
  q('tv').onclick=()=>{rsShowVi=!rsShowVi;q('vi').classList.toggle('hide',!rsShowVi)};
  q('keep').onchange=e=>{rsKeep=e.target.checked;store.set('rs_keep',rsKeep)};
  q('prev').onclick=()=>{goRS((rsIdx-1+ITEMS('rs').length)%ITEMS('rs').length);redo()};
  q('next').onclick=()=>{goRS((rsIdx+1)%ITEMS('rs').length);redo()};
  q('rand').onclick=()=>{goRS(Math.floor(Math.random()*ITEMS('rs').length));redo()};

  function speakModel(cb,next){stage.classList.add('speaking');ptePlay();speak(it.en,()=>{stage.classList.remove('speaking');pteEndPlay(next);cb&&cb()})}
  q('play').onclick=()=>{
    stopAll();const my=session;q('result').innerHTML='';
    resetMicUI();
    if(exam){
      setStatus('🔊 Nghe kỹ… sau tiếng bíp hãy nói ngay');
      speakModel(()=>{if(my!==session)return;beep();setTimeout(()=>{if(my===session)startRecord(my)},300)},true);
    }else{
      setStatus('🔊 Đang phát câu mẫu…');
      speakModel(()=>{if(my===session)setStatus('Bấm nút micro để ghi âm và nói lại.')});
    }
  };
  q('mic').onclick=()=>{
    if(recording){stopHandle&&stopHandle();return}
    stopAll();startRecord(session);
  };
  function resetMicUI(){
    recording=false;stopTimers();
    const mb=q('mic');if(!mb)return;
    mb.classList.remove('on');mb.style.removeProperty('--lvl');mb.innerHTML=IC.mic;
    q('miclabel').textContent='Ghi âm';
  }
  async function startRecord(my){
    if(recording)return;
    recording=true;q('result').innerHTML='';q('live').textContent='';
    const mb=q('mic');mb.classList.add('on');mb.innerHTML=IC.stop;q('miclabel').textContent='Dừng · 0:00';
    setStatus('🎙 Đang ghi âm… hãy nói thật rõ','rec');
    let mic=null;
    if(rsKeep||!SR){try{mic=await startMic();activeMic=mic}catch(e){mic=null}}
    if(my!==session){if(mic)mic.stop();return}
    t0=performance.now();
    const maxMs=exam?MAX_S*1000:Math.max(10000,wcount(it.en)*1000+6000),silMs=exam?SIL_S*1000:2200;
    pteRec(Math.round(maxMs/1000),+(silMs/1000).toFixed(1),!!SR);
    timer=setInterval(()=>{const s=Math.floor((performance.now()-t0)/1000);q('miclabel').textContent='Dừng · '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250);
    const loop=()=>{if(mic)mb.style.setProperty('--lvl',mic.level().toFixed(2));raf=requestAnimationFrame(loop)};
    loop();
    if(SR){
      activeRec=runRecognition({
        maxMs,silenceMs:silMs,
        onUpdate:t=>{q('live').textContent=t},
        onDone:res=>{activeRec=null;finish(my,res,mic)}
      });
      stopHandle=()=>{activeRec&&activeRec.stop()};
    }else{
      stopHandle=()=>finish(my,null,mic);
    }
  }
  async function finish(my,res,mic){
    resetMicUI();stopHandle=null;
    pteDone((performance.now()-t0)/1000);
    let blob=null;
    if(mic){try{blob=await mic.stop()}catch(e){}activeMic=null}
    if(my!==session)return;
    q('live').textContent='';
    const resEl=q('result');
    const audioHTML=blob&&blob.size?`<div class="sec">Bản ghi của bạn</div><audio controls src="${blobUrl(blob)}"></audio>`:'';
    if(!res){setStatus('Đã ghi âm xong. Nghe lại bên dưới.');resEl.innerHTML=`<div class="res">${audioHTML||'<div class="note">Không lưu được bản ghi.</div>'}</div>`;return}
    if(res.error&&['audio-capture','not-allowed','service-not-allowed'].includes(res.error)&&mic&&!res.text){
      rsKeep=false;store.set('rs_keep',false);q('keep').checked=false;
      setStatus('Chưa chấm được','');
      resEl.innerHTML=`<div class="warnbox">Điện thoại này không cho <b>vừa ghi âm vừa chấm điểm</b>. App đã tự tắt “Lưu bản ghi”, bạn hãy bấm micro nói lại để được chấm điểm.</div>${audioHTML?`<div class="res">${audioHTML}</div>`:''}`;return;
    }
    if(res.error&&!res.text){
      const map={'not-allowed':'Bạn chưa cho phép micro cho trang web.','service-not-allowed':'Trình duyệt không cho dùng nhận dạng giọng nói ở đây (hãy mở link https trong tab mới).','audio-capture':'Không thu được âm thanh (micro bị bận hoặc bị chặn).','network':'Cần có mạng để nhận dạng giọng nói.'};
      setStatus('Có lỗi khi chấm');
      resEl.innerHTML=`<div class="warnbox">${esc(map[res.error]||('Lỗi: '+res.error))}</div>${audioHTML?`<div class="res">${audioHTML}</div>`:''}`;return;
    }
    if(!res.text){
      setStatus('Không nghe thấy bạn nói');
      resEl.innerHTML=`<div class="warnbox">Không nghe thấy bạn nói. Hãy nói to và rõ hơn rồi thử lại.</div>${audioHTML?`<div class="res">${audioHTML}</div>`:''}`;return;
    }
    const s=scoreRS(it.en,res.text,res.conf,res.tm);
    saveScore('rs',it.n,s.total,13);
    const entryId=Date.now();
    addHist({id:entryId,s:SET('rs').id,en:it.en,n:it.n,total:s.total,content:s.content,fluency:s.fluency,pron:s.pron,text:res.text,a:!!(blob&&blob.size)},blob&&blob.size?blob:null);
    if(exam){q('en').classList.remove('blur')}
    setStatus(s.total>=10?'Tuyệt vời! 🎉':s.total>=7?'Khá tốt, cố thêm chút nữa':'Chưa tốt, nghe lại rồi thử lại nhé');
    resEl.innerHTML=resultHTML(it,s,res,audioHTML);
    resEl.insertAdjacentHTML('beforeend','<div data-a="aibox"></div>');
    rsAIFeedback(resEl.querySelector('[data-a=aibox]'),it,s,res,entryId);
    resEl.querySelector('[data-a=hear]').onclick=()=>speak(it.en);
    const cmp=resEl.querySelector('[data-a=cmp]');
    if(cmp)cmp.onclick=()=>{const au=resEl.querySelector('audio');speak(it.en,()=>{au&&au.play().catch(()=>{})})};
    resEl.querySelector('[data-a=retry]').onclick=()=>{resEl.innerHTML='';q('live').textContent='';window.scrollTo&&body.scrollTo({top:0,behavior:'smooth'});setStatus('Bấm micro để thử lại câu này.')};
    resEl.scrollIntoView&&resEl.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
function resultHTML(it,s,res,audioHTML){
  const r=s.total/13,col=`var(--${gradeCls(r)==='ok'?'ok':gradeCls(r)==='warn'?'warn':'bad'})`;
  const C=2*Math.PI*52,dash=(C*r).toFixed(1);
  const bar=(label,v,mx)=>{const rr=v/mx;const c=`var(--${gradeCls(rr)})`;return `<div class="metric"><div class="mrow"><span>${label}</span><span>${v}/${mx}</span></div><div class="mbar"><i style="width:${rr*100}%;background:${c}"></i></div></div>`};
  const missed=s.r.filter((_,i)=>!s.refHit[i]);
  let tip;
  if(s.content<3&&missed.length)tip=`Từ còn thiếu hoặc sai: <b>${esc([...new Set(missed)].slice(0,8).join(', '))}</b>. Nghe lại và lặp lại cả cụm, đừng bỏ từ nhỏ như a, the, of.`;
  else if(s.fluency<=3)tip='Đủ từ rồi! Hãy nói <b>liền mạch hơn</b>, tránh ngập ngừng giữa câu và bắt đầu nói ngay sau tiếng bíp.';
  else if(s.pron<=3)tip='Phát âm từng từ <b>rõ và đủ âm cuối</b> hơn, đặc biệt các từ tô đỏ.';
  else tip='Rất tốt, giữ nhịp độ này và thử câu tiếp theo!';
  return `<div class="res">
    <div class="ring"><svg viewBox="0 0 120 120" width="132" height="132" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${dash} ${C.toFixed(1)}"/></svg>
      <div class="num"><div>${s.total}<small>/ 13 điểm</small></div></div></div>
    <div class="verdict">${s.total>=10?'Rất tốt':s.total>=7?'Khá':'Cần luyện thêm'}</div>
    ${bar('Content (nội dung)',s.content,3)}${bar('Oral Fluency (độ trôi chảy)',s.fluency,5)}${bar('Pronunciation (phát âm)',s.pron,5)}
    <div class="sec">Câu mẫu (xanh = đúng, đỏ = thiếu/sai)</div>
    <div class="words">${markWords(it.en,res.text)}</div>
    <div class="vi">${esc(it.vi)}</div>
    <div class="sec">Máy nghe được bạn nói</div>
    <div>${esc(res.text)}</div>
    ${audioHTML}
    <div class="advice">💡 ${tip}</div>
    <div class="btns" style="margin-top:12px"><button class="btn sm" data-a="hear">🔊 Nghe mẫu</button>${audioHTML?'<button class="btn sm" data-a="cmp">⇄ Mẫu rồi đến bạn</button>':''}<button class="btn sm pri" data-a="retry">🔁 Thử lại</button></div>
    <div class="note">Content tính theo số từ nói đúng thứ tự (thang PTE). Fluency và Pronunciation là <b>ước lượng</b> từ độ nhận dạng, tốc độ và chỗ ngập ngừng, không phải điểm chính thức của Pearson.</div>
  </div>`;
}

function rsHistory(body){
  if(!hist.length){
    body.innerHTML=`<div class="empty"><b>Chưa có lịch sử</b>Hãy ghi âm và chấm điểm một câu, kết quả sẽ lưu ở đây.<div style="margin-top:14px"><button class="btn pri" data-a="start">Bắt đầu luyện</button></div></div>`;
    body.querySelector('[data-a=start]').onclick=()=>{rsMode='practice';store.set('rs_mode',rsMode);renderRS()};
    return;
  }
  const last10=hist.slice(0,10);
  const avg=last10.reduce((a,h)=>a+h.total,0)/last10.length;
  const bestT=Math.max(...hist.map(h=>h.total));
  const curId=SET('rs').id;
  const uniq=new Set(hist.filter(h=>(h.s||'base')===curId).map(h=>h.n)).size;
  const todayStr=new Date().toDateString();
  const today=hist.filter(h=>new Date(h.id).toDateString()===todayStr).length;
  const pts=hist.slice(0,20).reverse();
  const W=300,H=90,base=76,bw=Math.min(22,W/pts.length*0.7),gap=W/pts.length;
  const bars=pts.map((h,i)=>{
    const hh=Math.max(2,h.total/13*66),x=i*gap+(gap-bw)/2;
    return `<rect x="${x.toFixed(1)}" y="${(base-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="3" style="fill:var(--${gradeCls(h.total/13)})"/>`;
  }).join('');
  body.innerHTML=`
  <div class="stats">
    <div class="stat"><b>${hist.length}</b><small>Tổng số lần chấm</small></div>
    <div class="stat"><b>${avg.toFixed(1)}<small style="font:600 13px 'Be Vietnam Pro'"> /13</small></b><small>Trung bình ${last10.length} lần gần nhất</small></div>
    <div class="stat"><b>${bestT}<small style="font:600 13px 'Be Vietnam Pro'"> /13</small></b><small>Điểm cao nhất</small></div>
    <div class="stat"><b>${uniq}<small style="font:600 13px 'Be Vietnam Pro'"> /${ITEMS('rs').length}</small></b><small>Câu đã luyện trong đề này · hôm nay ${today} lần</small></div>
  </div>
  <div class="chartbox"><div class="note" style="margin:0 0 4px">Điểm ${pts.length} lần gần nhất (cũ → mới)</div>
   <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ điểm gần đây"><line x1="0" y1="${base}" x2="${W}" y2="${base}" style="stroke:var(--line)"/><line x1="0" y1="${(base-66*10/13).toFixed(1)}" x2="${W}" y2="${(base-66*10/13).toFixed(1)}" stroke-dasharray="3 3" style="stroke:var(--line)"/>${bars}<text x="2" y="${(base-66*10/13-3).toFixed(1)}" font-size="8" style="fill:var(--muted)">10 điểm</text></svg></div>
  <div class="sec">Các lần luyện</div>
  <div class="hl">${hist.map((h,i)=>{
    const it=h.en?{en:h.en}:(D.rs[h.n-1]||{en:''});const c=gradeCls(h.total/13);
    return `<details class="h" data-i="${i}"><summary><span class="sc-chip ${c}">${h.total}<small>/13</small></span>
      <span class="h-main"><b>Câu #${h.n}</b><span class="h-sub">${fmtDate(h.id)} · ${esc(setName('rs',h.s||'base'))} · Content ${h.content} · Fluency ${h.fluency} · Phát âm ${h.pron}</span></span><span class="chev">›</span></summary>
      <div class="h-body"><div class="sec">Câu mẫu</div><div class="words">${markWords(it.en,h.text)}</div>
      <div class="sec">Máy nghe được</div><div>${esc(h.text)}</div>
      <div data-aud="${h.id}">${h.a?'<div class="note">Đang tải bản ghi…</div>':''}</div>
      ${h.ai?aiCardHTML(h.ai):''}
      <div class="btns" style="margin-top:10px"><button class="btn sm" data-a="hear" data-i="${i}">🔊 Nghe mẫu</button><button class="btn sm pri" data-a="redo" data-i="${i}">🎙 Luyện lại</button></div></div></details>`;
  }).join('')}</div>
  <button class="danger" data-a="clear">Xoá toàn bộ lịch sử</button>`;
  if(body._tg)body.removeEventListener('toggle',body._tg,true);
  body._tg=e=>{
    const d=e.target;if(!(d instanceof HTMLDetailsElement)||!d.open)return;
    const h=hist[+d.dataset.i];const holder=d.querySelector('[data-aud]');
    if(!h||!h.a||!holder||holder.dataset.done)return;
    holder.dataset.done='1';
    idb.get(h.id).then(b=>{holder.innerHTML=b?`<div class="sec">Bản ghi của bạn</div><audio controls src="${URL.createObjectURL(b)}"></audio>`:'<div class="note">Bản ghi này đã bị xoá để tiết kiệm bộ nhớ (chỉ giữ 40 bản gần nhất).</div>'});
  };
  body.addEventListener('toggle',body._tg,true);
  body.querySelector('.hl').onclick=e=>{
    const b=e.target.closest('button[data-a]');if(!b)return;
    const h=hist[+b.dataset.i];if(!h)return;
    if(b.dataset.a==='hear'){speak(h.en||(D.rs[h.n-1]||{}).en||'');return}
    const sid=h.s||'base';
    if(!setsOf('rs').some(s=>s.id===sid)){alert('Bộ đề này đã bị xoá nên không luyện lại được.');return}
    curSet.rs=sid;store.set('pte_curset',curSet);goRS(h.n-1);rsMode='practice';store.set('rs_mode',rsMode);renderRS()
  };
  body.querySelector('[data-a=clear]').onclick=()=>{
    if(!confirm('Xoá toàn bộ lịch sử chấm điểm và bản ghi âm?'))return;
    hist=[];store.set('pte_hist_rs',hist);scores.rs={};store.set('pte_scores',scores);idb.clear();renderRS();
  };
}

   <div class="meta">Câu ${wfIdx+1}/${ITEMS('wfd').length}</div>
   <div class="btns"><button class="btn pri" data-a="play">🔊 Nghe câu</button></div>
   <div class="note" data-a="plays">Đã nghe: 0 lần</div>
   <label class="note"><input type="checkbox" data-a="exam"${wfExam?' checked':''}> Chế độ thi thật: chỉ nghe 1 lần</label>
   <textarea class="type" data-a="inp" rows="3" placeholder="Gõ lại câu bạn nghe được…" autocapitalize="sentences" autocomplete="off" spellcheck="false"></textarea>
   <div class="btns"><button class="btn pri" data-a="submit">✔ Nộp bài & chấm</button></div>
   <div data-a="result"></div>
   ${navHTML}
  </div>
  <div class="note">Cách chấm (theo PTE): mỗi từ gõ <b>đúng chính tả</b> được 1 điểm, không xét hoa/thường và dấu câu, từ thừa không bị trừ.</div>${voiceNote()}`;
  const q=a=>body.querySelector(`[data-a=${a}]`);
  q('exam').onchange=e=>{wfExam=e.target.checked};
  q('play').onclick=()=>{
    if(wfExam&&plays>=1){q('plays').textContent='Chế độ thi thật: chỉ được nghe 1 lần.';return}
    plays++;q('plays').textContent='Đã nghe: '+plays+' lần';speak(it.en);
  };
  q('submit').onclick=()=>{
    const typed=q('inp').value;
    if(!typed.trim()){q('result').innerHTML='<div class="warnbox">Bạn chưa gõ gì.</div>';return}
    showWFResult(q('result'),it,typed);
  };
  body.querySelector('[data-a=prev]').onclick=()=>{wfIdx=(wfIdx-1+ITEMS('wfd').length)%ITEMS('wfd').length;store.set('wf_idx',wfIdx);stopAll();wfType(body)};
  body.querySelector('[data-a=next]').onclick=()=>{wfIdx=(wfIdx+1)%ITEMS('wfd').length;store.set('wf_idx',wfIdx);stopAll();wfType(body)};
  body.querySelector('[data-a=rand]').onclick=()=>{wfIdx=Math.floor(Math.random()*ITEMS('wfd').length);store.set('wf_idx',wfIdx);stopAll();wfType(body)};
}
function showWFResult(out,it,typed){
  const ref=norm(it.en),hyp=norm(typed);
  const refState=new Array(ref.length).fill('miss'),hypState=new Array(hyp.length).fill('extra');
  // pass 1: exact matches (order independent)
  ref.forEach((w,i)=>{
    const j=hyp.findIndex((h,j)=>hypState[j]==='extra'&&h===w);
    if(j>=0){refState[i]='ok';hypState[j]='ok'}
  });
  // pass 2: near misses (misspellings)
  const spell={};
  ref.forEach((w,i)=>{
    if(refState[i]!=='miss')return;
    let best=-1,bd=99;
    hyp.forEach((h,j)=>{
      if(hypState[j]!=='extra')return;
      const d=lev(w,h);
      if(d<bd){bd=d;best=j}
    });
    if(best>=0&&bd<=Math.max(1,Math.floor(w.length*0.4))){refState[i]='sp';hypState[best]='sp';spell[i]=hyp[best]}
  });
  const got=refState.filter(s=>s==='ok').length;
  saveScore('wfd',it.n,got,ref.length);
  const pct=Math.round(got/ref.length*100);
  const refHtml=ref.map((w,i)=>{
    const c=refState[i]==='ok'?'w-ok':refState[i]==='sp'?'w-sp':'w-miss';
    const tip=refState[i]==='sp'?` <small class="vi">(bạn gõ: ${esc(spell[i])})</small>`:'';
    return `<span class="${c}">${esc(w)}</span>${tip}`;
  }).join(' ');
  const hypHtml=hyp.map((w,j)=>`<span class="${hypState[j]==='ok'?'w-ok':hypState[j]==='sp'?'w-sp':'w-ex'}">${esc(w)}</span>`).join(' ');
  out.innerHTML=`
  <div class="total">${got}/${ref.length}</div>
  <div class="note" style="text-align:center">${pct}% · ${pct>=90?'Rất tốt! 🎉':pct>=70?'Khá ổn, chú ý chính tả':'Cần nghe kỹ hơn, thử lại nhé'}</div>
  <div class="note">Câu đúng (xanh = đúng, cam = sai chính tả, đỏ = thiếu):</div>
  <div class="words">${refHtml}</div>
  <div class="note">Bạn đã gõ (gạch ngang = từ thừa):</div>
  <div class="words">${hypHtml}</div>
  <div class="note">Câu đầy đủ:</div>
  <div style="font-weight:600">${esc(it.en)}</div>
  <div class="vi">${esc(it.vi)}</div>
  <div class="btns"><button class="btn sm" data-a="hear">🔊 Nghe lại</button></div>`;
  out.querySelector('[data-a=hear]').onclick=()=>speak(it.en);
}

/* ============ INIT ============ */
if(typeof i!=='undefined'&&typeof S!=='undefined')mountChat(i,S[i]);
const saved=store.get('pte_tab','essay');
renderES();
if(saved!=='essay')showTab(saved);
})();
</script>
